<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大模型德州回放</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;700;900&family=Oswald:wght@400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* Layout: a fixed 1600x900 stage scaled to the page width, replay controls underneath. One committed night look. */
:root {
  --ink: #05060B;
  --text: #F3F1EC;
  --muted: #9AA0B8;
  --gold: #E9C46A;
  --hot: #FF2E7E;
  --sil: #0B0D18;
  --display: 'ZCOOL QingKe HuangYou', 'Noto Sans SC', sans-serif;
  --brush: 'Ma Shan Zheng', 'ZCOOL QingKe HuangYou', serif;
  --body: 'Noto Sans SC', system-ui, sans-serif;
  --num: 'Oswald', 'Noto Sans SC', sans-serif;
  color-scheme: dark;
}
html, body { background: var(--ink); color: var(--text); }
body { font-family: var(--body); }
.wrap { max-width: 1600px; margin: 0 auto; padding-block: 18px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.top h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(22px, 3vw, 30px); color: var(--gold); text-wrap: balance; }
.top p { margin: 0; color: var(--muted); font-size: 13px; }
.box { width: 100%; }
.vp { position: relative; margin: 0 auto; overflow: hidden; border-radius: 10px; box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 30px 80px rgba(0,0,0,0.6); }
.stage { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; overflow: hidden; background: var(--ink); }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.controls button { font: 700 14px var(--body); color: var(--ink); background: var(--gold); border: 0; border-radius: 6px; padding: 10px 18px; min-height: 44px; cursor: pointer; }
.controls button.ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25); }
.controls button:focus-visible { outline: 3px solid var(--hot); outline-offset: 2px; }
.chaps { display: flex; flex-wrap: wrap; gap: 6px; }
.chaps button { font: 500 13px var(--body); color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 6px 12px; min-height: 36px; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); }
.chaps button.on { color: var(--ink); background: var(--text); box-shadow: none; }
.chaps button.now { background: var(--gold); }
.chaps button:focus-visible { outline: 3px solid var(--hot); outline-offset: 2px; }

/* the room */
#cam { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; transition: transform var(--camt, 1.4s) cubic-bezier(0.45, 0, 0.2, 1); }
#world { position: absolute; inset: 0; }
/* 房间和牌桌是一整张美漫背景图（backdrop.jpg），台布的椭圆和下面的发牌、筹码坐标严格对齐：中心 (800,430)，台布半径 578×197。
   图比舞台四周各宽出一圈（左右160、上下90），镜头拉远时不露边 */
.backdrop { position: absolute; left: -160px; top: -90px; width: 1920px; height: 1080px; filter: brightness(0.82) saturate(0.95); }
.bdext { position: absolute; left: -240px; top: -120px; width: 2080px; height: 1140px; background: url(backdrop.jpg) center / cover; filter: blur(14px) brightness(0.3); }
.spill { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 48% 60% at 52% -8%, rgba(255,232,190,0.13), transparent 70%); }
#tablecv { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; }
.pool { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 34% 26% at 50% 45%, rgba(255,238,205,0.09), transparent 75%); }
.vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 80% 75% at 50% 46%, transparent 58%, rgba(0,0,0,0.72) 100%); z-index: 60; }

/* pot + hud */
#pot { position: absolute; left: 800px; top: 336px; transform: translate(-50%, -100%); display: flex; align-items: flex-end; gap: 12px; z-index: 25; }
#pot svg { display: block; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.55)); }
#pot .lbl { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; }
#pot small { font-size: 12px; letter-spacing: 3px; color: rgba(214,232,222,0.7); margin-bottom: 4px; }
#pot b { font: 500 32px var(--num); color: var(--gold); font-variant-numeric: tabular-nums; }

/* seats */
.seat { position: absolute; width: 170px; height: 236px; transform: translate(-50%, -100%) scale(var(--sc)); transform-origin: 50% 100%; transition: opacity 0.5s; }
.bust { position: absolute; left: 0; top: 0; width: 170px; height: 187px; color: var(--sil); transition: transform 0.4s cubic-bezier(0.3, 1.4, 0.5, 1); }
.bust svg { width: 100%; height: 100%; filter: drop-shadow(0 0 1px var(--c)) drop-shadow(0 0 7px color-mix(in srgb, var(--c) 55%, transparent)); transition: filter 0.4s; }
.seat.on .bust { transform: translateY(-6px); }
.seat.on .bust svg { filter: drop-shadow(0 0 1.5px var(--c)) drop-shadow(0 0 14px var(--c)) drop-shadow(0 0 30px color-mix(in srgb, var(--c) 60%, transparent)); }
.seat.fold { opacity: 0.42; }
.seat.fold .bust svg, .seat.lose .bust svg { filter: grayscale(1) brightness(0.8) drop-shadow(0 0 1px #6B6F80); }
/* 立绘坐在桌边：只露到胸口，下沿渐隐进名牌，颜色描边和剪影一样。
   渐隐遮罩在图片上，描边发光在外面一层，两个放在同一个元素上发光会照出整块矩形 */
.bust .glow { position: absolute; inset: 0; filter: drop-shadow(0 0 1px var(--c)) drop-shadow(0 0 8px color-mix(in srgb, var(--c) 55%, transparent)); transition: filter 0.4s; }
.bust img { position: absolute; left: 50%; top: -6px; width: 178px; transform: translateX(-50%); -webkit-mask-image: linear-gradient(#000 66%, transparent 92%); mask-image: linear-gradient(#000 66%, transparent 92%); }
.seat.on .bust .glow { filter: drop-shadow(0 0 2px var(--c)) drop-shadow(0 0 16px var(--c)) drop-shadow(0 0 32px color-mix(in srgb, var(--c) 60%, transparent)); }
.seat.fold .bust .glow, .seat.lose .bust .glow { filter: grayscale(1) brightness(0.7); }
/* 两侧靠上的座位，名牌会被下面那位的立绘挡住，改放到头顶上 */
.seat.ptop .plate { bottom: auto; top: -38px; }
.seat.ptop .tag { top: -42px; }
.plate { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 16px 6px; border-radius: 8px; background: rgba(6,7,13,0.86); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), inset 0 -2px 0 var(--c); white-space: nowrap; }
.plate b { font-family: var(--display); font-weight: 400; font-size: 20px; line-height: 1.1; }
.stk { font: 500 15px var(--num); color: var(--gold); font-variant-numeric: tabular-nums; }
.tag { position: absolute; left: 50%; top: 2px; transform: translate(-50%, -100%); padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; opacity: 0; transition: opacity 0.25s; }
.tag.show { opacity: 1; }
.tag.think { background: rgba(233,196,106,0.95); color: var(--ink); }
.tag.allin { background: var(--hot); color: var(--ink); }
.tag.quiet { background: rgba(255,255,255,0.14); color: #D8DBE6; }
.dbtn { position: absolute; width: 26px; height: 26px; transform: translate(-50%, -50%); border-radius: 50%; background: #FAF7F0; color: var(--ink); font: 700 14px var(--num); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #C9A24A, 0 4px 8px rgba(0,0,0,0.6); z-index: 21; }

/* cards */
.card { position: absolute; left: 0; top: 0; perspective: 700px; transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s; z-index: 20; }
.card.big { width: 68px; height: 96px; }
.card.sm { width: 44px; height: 62px; }
.card .in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1); }
.card.up .in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: 6px; backface-visibility: hidden; box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset, 0 6px 12px rgba(0,0,0,0.55); }
.back { background: repeating-linear-gradient(45deg, rgba(255,255,255,0.07) 0 1.5px, transparent 1.5px 7px), repeating-linear-gradient(-45deg, rgba(255,255,255,0.07) 0 1.5px, transparent 1.5px 7px), #1B2347; box-shadow: inset 0 0 0 3px #FAF7F0, inset 0 0 0 4px #C9A24A, 0 6px 12px rgba(0,0,0,0.55); }
.front { transform: rotateY(180deg); background: linear-gradient(160deg, #FFFDF8, #EEE9DE); color: #15151B; }
.front .ix { position: absolute; left: 5px; top: 4px; display: flex; flex-direction: column; align-items: center; font-family: var(--num); line-height: 0.95; }
.front .pip { position: absolute; right: 6px; bottom: 3px; line-height: 1; }
.big .ix b { font-size: 21px; font-weight: 700; } .big .ix i { font-style: normal; font-size: 16px; } .big .pip { font-size: 38px; }
.sm .ix b { font-size: 15px; font-weight: 700; } .sm .ix i { font-style: normal; font-size: 12px; } .sm .pip { font-size: 24px; }
.card.red .front { color: #C8223B; }
.card.dim { opacity: 0.45; }
.card.hl .face.front { box-shadow: 0 0 0 2px var(--gold), 0 0 22px rgba(233,196,106,0.65); }

/* chips */
.bet { position: absolute; transform: translate(-50%, -88%); display: flex; flex-direction: column; align-items: center; gap: 2px; z-index: 22; transition: left 0.55s cubic-bezier(0.5, 0, 0.4, 1), top 0.55s cubic-bezier(0.5, 0, 0.4, 1), opacity 0.4s; }
.bet svg { display: block; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.55)); }
.bet span { font: 500 13px var(--num); color: #F0E6CC; background: rgba(5,6,11,0.72); padding: 0 7px; border-radius: 3px; font-variant-numeric: tabular-nums; }
.bet.gone { opacity: 0; }

/* table talk */
.pop { position: absolute; transform: translate(-50%, -100%) translateY(6px); opacity: 0; background: rgba(9,10,20,0.94); color: var(--text); font-weight: 700; font-size: 17px; padding: 7px 14px; border-radius: 10px; white-space: nowrap; transition: transform 0.3s cubic-bezier(0.3, 1.4, 0.5, 1), opacity 0.25s; z-index: 900; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1), 0 8px 18px rgba(0,0,0,0.5); }
.pop i { font-style: normal; font-size: 12px; margin-right: 8px; }
.pop.in { opacity: 1; transform: translate(-50%, -100%); }
.pop.below { transform: translate(-50%, 0) translateY(-6px); }
.pop.below.in { transform: translate(-50%, 0); }

/* showdown */
.stamp { position: absolute; transform: translate(-50%, -50%) rotate(-8deg) scale(2); opacity: 0; font-family: var(--display); font-size: 32px; padding: 2px 14px; border: 3px solid #C3C8D8; color: #C3C8D8; border-radius: 6px; background: rgba(5,6,11,0.82); transition: transform 0.3s cubic-bezier(0.3, 1.5, 0.5, 1), opacity 0.2s; z-index: 900; white-space: nowrap; }
.stamp.win { border-color: var(--gold); color: var(--gold); }
.stamp.huge { font-size: 58px; border-width: 4px; color: var(--text); border-color: var(--text); }
.stamp.in { opacity: 1; transform: translate(-50%, -50%) rotate(-8deg) scale(1); }
#win { position: absolute; left: 50%; top: 116px; transform: translateX(-50%) scale(0.7); opacity: 0; transition: transform 0.45s cubic-bezier(0.3, 1.4, 0.5, 1), opacity 0.3s; z-index: 75; text-align: center; padding: 14px 56px 18px; background: rgba(5,6,11,0.9); box-shadow: inset 0 1px 0 rgba(233,196,106,0.6), inset 0 -1px 0 rgba(233,196,106,0.6); }
#win.show { transform: translateX(-50%) scale(1); opacity: 1; }
#win small { display: block; font: 500 15px var(--num); letter-spacing: 10px; color: var(--gold); }
#win strong { display: block; font-family: var(--display); font-weight: 400; font-size: 46px; line-height: 1.25; }
#win b { display: block; font: 500 56px var(--num); color: var(--gold); line-height: 1; font-variant-numeric: tabular-nums; }

/* dialogue */

/* all-in cut-in */
#cut { position: absolute; inset: 0; z-index: 90; pointer-events: none; opacity: 0; }
#cut.go { opacity: 1; }
#cut.out { opacity: 0; transition: opacity 0.3s; }
#cut .dim { position: absolute; inset: 0; background: rgba(4,4,10,0.72); }
#cut .band { position: absolute; left: -300px; top: 300px; width: 2200px; height: 320px; background: repeating-linear-gradient(90deg, rgba(5,6,11,0.12) 0 4px, transparent 4px 40px), var(--hot); box-shadow: 0 -6px 0 var(--gold), 0 6px 0 var(--gold); transform: rotate(-9deg) translateX(-120%); }
#cut.go .band { animation: bandIn 0.32s cubic-bezier(0.2, 0.9, 0.2, 1) forwards, lines 0.4s linear infinite; }
#cut .who { position: absolute; left: 50px; top: 20px; width: 600px; height: 880px; transform: translateX(-120%); }
#cut .who svg { position: absolute; left: 10px; bottom: 0; width: 520px; height: 572px; color: var(--sil); filter: drop-shadow(0 0 3px var(--hot)) drop-shadow(0 0 24px var(--hot)); }
#cut .who img { position: absolute; left: 0; top: 20px; width: 600px; filter: drop-shadow(4px 0 0 #FFF) drop-shadow(-4px 0 0 #FFF) drop-shadow(0 4px 0 #FFF) drop-shadow(0 -4px 0 #FFF) drop-shadow(0 0 28px var(--hot)); }
#cut.go .who { animation: whoIn 0.38s 0.08s cubic-bezier(0.2, 0.9, 0.2, 1) forwards; }
#cut .shout { position: absolute; left: 640px; top: 110px; font-family: var(--brush); font-size: 250px; line-height: 1; color: var(--gold); text-shadow: 7px 7px 0 #05060B; transform: rotate(-9deg) scale(3); opacity: 0; }
#cut.go .shout { animation: slam 0.3s 0.25s cubic-bezier(0.2, 1.4, 0.4, 1) forwards; }
#cut .sub { position: absolute; left: 720px; top: 430px; display: flex; gap: 28px; align-items: baseline; transform: rotate(-9deg); opacity: 0; }
#cut .sub b { font: italic 700 116px var(--num); color: #05060B; letter-spacing: 6px; }
#cut .sub span { font: 700 70px var(--num); color: var(--text); }
#cut.go .sub { animation: fadeUp 0.3s 0.45s forwards; }
#cut .flash { position: absolute; inset: 0; background: #FFF; opacity: 0; }
#cut.go .flash { animation: flash 0.45s ease-out; }
#world.shake { animation: shake 0.45s; }

/* intro + end */
.overlay { position: absolute; inset: 0; z-index: 95; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(5,6,11,0.8); opacity: 0; pointer-events: none; transition: opacity 0.8s; text-align: center; }
.overlay.show { opacity: 1; pointer-events: auto; }
#intro .t1 { font-family: var(--brush); font-size: 128px; line-height: 1; color: var(--gold); text-shadow: 5px 5px 0 #000; }
#intro .t2 { font-family: var(--display); font-size: 28px; letter-spacing: 6px; }
#end .t2 { font-family: var(--display); font-size: 38px; }
#end .t3 { font-size: 16px; color: var(--muted); }
#end button { font: 700 18px var(--body); color: var(--ink); background: var(--gold); border: 0; border-radius: 6px; padding: 12px 26px; min-height: 48px; cursor: pointer; }
#end button:focus-visible { outline: 3px solid var(--hot); outline-offset: 2px; }

.stage.paused *, .stage.paused *::after { animation-play-state: paused !important; }
.stage.ff *, .stage.ff *::after { transition: none !important; animation: none !important; }

@keyframes blink { 50% { opacity: 0.2; } }
@keyframes wave { from { height: 5px; } to { height: 24px; } }
@keyframes bandIn { to { transform: rotate(-9deg) translateX(0); } }
@keyframes lines { to { background-position: 40px 0, 0 0; } }
@keyframes whoIn { to { transform: translateX(0); } }
@keyframes slam { to { opacity: 1; transform: rotate(-9deg) scale(1); } }
@keyframes fadeUp { from { opacity: 0; transform: rotate(-9deg) translateY(30px); } to { opacity: 1; transform: rotate(-9deg) translateY(0); } }
@keyframes flash { from { opacity: 0.85; } to { opacity: 0; } }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translate(-12px, 7px); } 40% { transform: translate(10px, -8px); } 60% { transform: translate(-7px, 5px); } 80% { transform: translate(5px, -3px); } }

@media (prefers-reduced-motion: reduce) {
  #world.shake, #cut.go .flash { animation: none; }
  #cut.go .band, #cut.go .shout, #cut.go .sub { animation: none; transform: rotate(-9deg); opacity: 1; }
  #cut.go .who { animation: none; transform: none; }
  #bar.typing #bar-talk .say::after { animation: none; }
}

/* letterbox: a thin top bar and a fixed bottom bar for stats and table talk */
#topbar { position: absolute; left: 0; top: 0; width: 1600px; height: 36px; box-sizing: border-box; padding: 0 28px; background: #000; z-index: 86; display: flex; align-items: center; justify-content: space-between; font-size: 15px; color: var(--muted); letter-spacing: 1px; }
#topbar .hand { font-family: var(--display); font-size: 18px; color: var(--text); margin-right: 12px; letter-spacing: 0; }
#topbar b { color: var(--gold); font-weight: 700; }
#topbar .com { display: flex; align-items: center; gap: 10px; max-width: 980px; white-space: nowrap; overflow: hidden; }
#topbar .com i { width: 7px; height: 7px; border-radius: 50%; background: var(--hot); flex-shrink: 0; }
#topbar .com span { font-family: var(--display); color: var(--gold); letter-spacing: 0; }
#topbar .com em { font-style: normal; color: var(--text); opacity: 0; transition: opacity 0.4s; }
#topbar .com em.on { opacity: 1; }
#topbar .com .eq { display: none; align-items: flex-end; gap: 2px; height: 14px; }
#topbar .com.talk .eq { display: inline-flex; }
#topbar .com .eq s { width: 3px; height: 4px; background: var(--gold); animation: eq 0.38s ease-in-out infinite alternate; }
#topbar .com .eq s:nth-child(2) { animation-delay: 0.12s; } #topbar .com .eq s:nth-child(3) { animation-delay: 0.24s; } #topbar .com .eq s:nth-child(4) { animation-delay: 0.06s; }
@keyframes eq { from { height: 3px; } to { height: 14px; } }
#topbar .com.talk i { box-shadow: 0 0 10px var(--hot); animation: blink 0.6s infinite; }
#topbar .com.talk em { color: #FFF; }
#bar { position: absolute; left: 0; bottom: 0; width: 1600px; height: 200px; background: #000; z-index: 86; }
/* 两层不交叉淡入淡出：旧的先退干净，新的再进来，避免上一手的对话和筹码统计叠在一起 */
#bar .pane { position: absolute; inset: 0; opacity: 0; transition: opacity 0.2s; }
#bar[data-mode="stats"] #bar-stats, #bar[data-mode="talk"] #bar-talk { opacity: 1; transition: opacity 0.3s 0.2s; }
#bar[data-mode="talk"].past #bar-talk { opacity: 0.55; }
#bar-stats { box-sizing: border-box; padding: 0 48px; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
#bar-stats .ttl { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); letter-spacing: 2px; }
#bar-stats .ttl b { color: var(--gold); font-weight: 700; }
#bar-stats .grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 14px; }
#bar-stats .cell { border-top: 3px solid var(--c); padding-top: 8px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
#bar-stats .cell b { font-family: var(--display); font-weight: 400; font-size: 20px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#bar-stats .cell span { font: 500 24px var(--num); color: var(--gold); font-variant-numeric: tabular-nums; }
#bar-stats .cell small { font: 500 14px var(--num); color: var(--muted); font-variant-numeric: tabular-nums; }
#bar-stats .cell small.up { color: #6FD6A8; }
#bar-stats .cell small.down { color: #FF8A98; }
#bar-talk .port { position: absolute; left: 0; bottom: 0; width: 220px; height: 268px; transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.2, 1); }
#bar.side-r #bar-talk .port { left: auto; right: 0; }
/* 斜切的色块是背景板；立绘两侧和底部被色块框住，头和肩膀从上沿探出去 */
#bar-talk .port::before { content: ""; position: absolute; inset: 0; clip-path: polygon(0 14%, 100% 0, 100% 100%, 0 100%); background: repeating-linear-gradient(135deg, rgba(5,6,11,0.16) 0 6px, transparent 6px 14px), var(--c); }
#bar.side-r #bar-talk .port::before { clip-path: polygon(0 0, 100% 14%, 100% 100%, 0 100%); }
#bar-talk .port svg { position: absolute; left: 0; bottom: 0; width: 220px; height: 238px; color: var(--ink); }
#bar-talk .port .fig { position: absolute; left: 0; right: 0; bottom: 0; top: -96px; overflow: hidden; }
#bar-talk .port img { position: absolute; left: 50%; top: 0; width: 280px; transform: translateX(-50%); filter: drop-shadow(0 8px 12px rgba(5,6,11,0.5)); }
#bar-talk .body { position: absolute; left: 256px; right: 40px; top: 26px; display: flex; flex-direction: column; gap: 10px; }
#bar.side-r #bar-talk .body { left: 40px; right: 256px; text-align: right; }
#bar.side-r #bar-talk .who { justify-content: flex-end; }
#bar.full #bar-talk .body { right: 540px; }
#bar.full.side-r #bar-talk .body { left: 540px; right: 256px; }
#bar-talk .who { display: flex; align-items: baseline; gap: 12px; }
#bar-talk .who span { font-family: var(--display); font-size: 26px; color: var(--c); }
#bar-talk .who small { font: 700 13px var(--num); letter-spacing: 2px; color: var(--muted); }
#bar-talk .who em { font-style: normal; font-size: 13px; color: var(--muted); }
#bar-talk .say { font-size: 30px; font-weight: 900; line-height: 1.4; color: var(--text); }
#bar.typing #bar-talk .say::after { content: "▌"; color: var(--c); animation: blink 0.7s infinite; }
#bar.thought #bar-talk .say { font-size: 25px; font-weight: 500; line-height: 1.55; color: #D9DCE6; }
#bar.thought #bar-talk .say::before { content: "（心声）"; color: var(--c); font-weight: 700; }
#bar.act #bar-talk .say { font-size: 22px; font-weight: 500; color: var(--muted); }
#bar-talk .inner { position: absolute; right: 36px; top: 24px; bottom: 24px; width: 470px; box-sizing: border-box; padding: 4px 0 0 24px; border-left: 2px dashed rgba(255,255,255,0.28); opacity: 0; transition: opacity 0.35s; }
#bar.side-r #bar-talk .inner { right: auto; left: 36px; padding: 4px 24px 0 0; border-left: 0; border-right: 2px dashed rgba(255,255,255,0.28); text-align: right; }
#bar-talk .inner.show { opacity: 1; }
#bar-talk .inner h4 { margin: 0 0 6px; font-family: var(--display); font-weight: 400; font-size: 17px; color: #CDD1DF; }
#bar-talk .inner p { margin: 0; font-size: 17px; line-height: 1.6; color: #E4E7F0; }

/* replay page additions */
body { margin: 0; }
.picker { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.picker select { font: 500 14px var(--body); color: var(--text); background: #0E1020; border: 0; border-radius: 6px; padding: 10px 12px; min-height: 44px; max-width: min(420px, 100%); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2); }
.picker select:focus-visible { outline: 3px solid var(--hot); outline-offset: 2px; }
.picker label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); min-height: 44px; cursor: pointer; }
.picker input { width: 18px; height: 18px; accent-color: var(--gold); }
.src { font-size: 12px; color: var(--muted); }
/* 整集：片头、片尾。片头里第一季的网页界面是用 DOM 重搭的，好让面板、头像、牌一块块飞走，再把旧牌桌变成新牌桌 */
#ep { position: absolute; inset: 0; z-index: 120; display: none; overflow: hidden; pointer-events: none; }
#ep.on { display: block; }
#ep.dark { background: #05060B; }
#ep .oldcam, #ep .ttl, #ep .cast, #ep .outro, #ep .lineup { display: none; }
#ep.oldon .oldcam { display: block; }
#ep .oldcam { position: absolute; inset: 0; background: #05060B; transform-origin: 50% 50%; transition: transform 1.6s cubic-bezier(0.45, 0, 0.2, 1); }
/* 镜头位置：推到旧牌桌、摇到右边的思考面板、拉回全景 */
#ep .oldcam.cam-table { transform: scale(1.3) translate(112px, -63px); }
#ep .oldcam.cam-think { transform: scale(1.55) translate(-405px, 15px); }
/* 旧界面整体缩到左下，给右上角的铁皮留出位置 */
#ep .old { position: absolute; inset: 0; background: #EDF0F5; transform-origin: 0 100%; transform: scale(0.86); transition: transform 10s linear, background 1s; font-family: var(--body); box-shadow: 0 0 0 2000px #05060B; }
#ep .old.drift { transform: scale(0.89); }
#ep .old.popin { animation: oldPop 0.45s cubic-bezier(0.2, 1.4, 0.4, 1) backwards; }
@keyframes oldPop { from { transform: scale(1.1); opacity: 0; filter: brightness(2); } to { transform: scale(0.86); opacity: 1; filter: none; } }
.old .op { position: absolute; box-sizing: border-box; background: #262B36; border-radius: 14px; color: #E9ECF2; box-shadow: 0 8px 20px rgba(0,0,0,0.25); padding: 14px 16px; font-size: 13px; transition: transform 0.7s cubic-bezier(0.6, 0, 0.9, 0.4), opacity 0.7s, box-shadow 0.5s; }
.old .p1 { left: 13px; top: 13px; width: 208px; height: 360px; }
.old .p2 { left: 13px; top: 388px; width: 208px; height: 268px; }
.old .p3 { left: 1244px; top: 27px; width: 314px; height: 665px; overflow: hidden; transform-origin: 80% 30%; }
.old h5 { margin: 0 0 10px; padding-bottom: 8px; font-size: 15px; border-bottom: 1px solid rgba(255,255,255,0.15); }
.old ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.old li { display: flex; justify-content: space-between; padding: 5px 8px; border-radius: 6px; background: rgba(255,255,255,0.06); }
.old li b { color: #F5A524; }
.old .tabs { display: flex; justify-content: space-around; padding-bottom: 10px; font-size: 15px; border-bottom: 2px solid rgba(255,255,255,0.12); }
.old .tabs .on { color: #5AA9FF; }
.old .think { font-size: 13px; line-height: 1.7; color: #D9DDE6; }
.old .think h6 { margin: 12px 0 4px; font-size: 14px; color: #4ADE80; }
.old .think p { margin: 0; }
.old .ob { position: absolute; left: 758px; top: 18px; width: 82px; height: 26px; border-radius: 13px; background: #F97316; color: #FFF; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: transform 0.6s cubic-bezier(0.6, 0, 0.9, 0.4), opacity 0.6s; }
.old .ot { position: absolute; left: 417px; top: 267px; width: 765px; height: 366px; border-radius: 183px; background: #0F1E3D; transition: left 1.2s, top 1.2s, width 1.2s, height 1.2s, border-radius 1.2s, background 1.2s; transition-timing-function: cubic-bezier(0.7, 0, 0.2, 1); }
.old .felt { position: absolute; inset: 28px; border-radius: 160px; background: #1D3A6B; transition: inset 1.2s, border-radius 1.2s, background 1.2s; transition-timing-function: cubic-bezier(0.7, 0, 0.2, 1); }
.old .pot { position: absolute; left: 0; right: 0; top: 128px; text-align: center; color: #F5A524; font-weight: 700; font-size: 17px; transition: opacity 0.3s; }
.old .qs { position: absolute; left: 0; right: 0; top: 160px; display: flex; justify-content: center; gap: 10px; transition: opacity 0.3s; }
.old .qs i { width: 40px; height: 56px; border-radius: 6px; background: #18294A; color: #6B7A99; font-style: normal; display: flex; align-items: center; justify-content: center; }
.old .oa { position: absolute; width: 120px; margin: -28px 0 0 -60px; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: transform 0.8s cubic-bezier(0.6, 0, 0.9, 0.4) calc(var(--i) * 60ms), opacity 0.8s calc(var(--i) * 60ms); }
.old .oa span { width: 56px; height: 56px; border-radius: 50%; background: #FFF; box-shadow: 0 0 0 3px #D7DCE6; color: #1F2937; font: 700 18px var(--num); display: flex; align-items: center; justify-content: center; }
.old .oa em { font-style: normal; font-size: 12px; color: #FFF; background: #6B7280; padding: 1px 8px; border-radius: 8px; }
.old .oa small { font-size: 11px; color: #F5A524; background: #4B5563; padding: 0 8px; border-radius: 8px; }
.old .oc { position: absolute; width: 36px; height: 56px; border-radius: 5px; background: repeating-linear-gradient(45deg, #3B5BA5 0 3px, #2C4787 3px 6px); box-shadow: 20px 0 0 -1px #2C4787; transition: transform 0.7s cubic-bezier(0.6, 0, 0.9, 0.4) calc(var(--i) * 50ms), opacity 0.7s calc(var(--i) * 50ms); }
/* 旁白说到“只能看旁边一大段文字”：右边思考面板放大，其余压暗 */
/* “闷头打牌，一句话都不说”：八个头像挨个亮一下，头上冒个“……” */
.old .oa::after { content: '……'; position: absolute; top: -34px; left: 50%; transform: translateX(-50%) scale(0); padding: 2px 10px; border-radius: 10px; background: #FFF; color: #6B7280; font-size: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
.old.pulse .oa span { animation: avPulse 0.8s ease-in-out both; animation-delay: calc(var(--i) * 0.16s); }
.old.pulse .oa::after { animation: dots 1.6s ease-in-out both; animation-delay: calc(var(--i) * 0.16s); }
@keyframes avPulse { 45% { transform: scale(1.35); box-shadow: 0 0 0 4px #F5A524, 0 0 26px #F5A524; } }
@keyframes dots { 15%, 80% { transform: translateX(-50%) scale(1); } 100% { transform: translateX(-50%) scale(0); } }
/* “只能翻这一大段文字”：思考面板发光，里面的字飞快往上滚 */
.old.read .p3 { box-shadow: 0 0 0 4px #5AA9FF, 0 0 40px rgba(90,169,255,0.6); }
.old.read .think { animation: readScroll 3.6s linear both; }
@keyframes readScroll { to { transform: translateY(-62%); } }
/* 剩下的旧牌桌闪几下故障 */
.old.b5 .ot { animation: tableGlitch 0.18s steps(2) infinite; }
@keyframes tableGlitch { 0% { transform: translate(-6px, 2px); filter: drop-shadow(8px 0 0 rgba(255,0,90,0.7)) drop-shadow(-8px 0 0 rgba(0,220,255,0.7)); } 100% { transform: translate(5px, -3px); filter: none; } }
#ep.jolt { animation: jolt 0.32s ease-out; }
@keyframes jolt { 20% { transform: translate(-14px, 8px); } 45% { transform: translate(12px, -9px); } 70% { transform: translate(-6px, 4px); } }
/* 拆界面：左边面板、右边面板、按钮、头像和牌依次飞出画面 */
.old.b1 .p1 { transform: translate(-520px, -90px) rotate(-18deg); opacity: 0; }
.old.b1 .p2 { transform: translate(-540px, 130px) rotate(14deg); opacity: 0; }
.old.b2 .p3 { transform: translate(600px, -40px) rotate(16deg); opacity: 0; }
.old.b3 .ob { transform: translateY(-140px); opacity: 0; }
.old.b3 .oa, .old.b3 .oc { transform: translate(calc(var(--dx) * 1px), calc(var(--dy) * 1px)) rotate(540deg) scale(0.4); opacity: 0; }
.old.b3 .pot, .old.b3 .qs { opacity: 0; }
/* 整屏碎裂：先从冲击点画出裂纹，再沿裂纹裂成一片片（每片是当前画面的副本，用多边形裁出来），最后朝镜头炸开 */
#ep .cracks { display: none; position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#ep.cracked .cracks { display: block; }
#ep .cracks path { fill: none; stroke: #FFF; stroke-width: 2.5; stroke-linejoin: round; filter: drop-shadow(0 0 3px #9FD0FF) drop-shadow(0 0 10px rgba(159,208,255,0.7)); stroke-dasharray: 2400; stroke-dashoffset: 2400; animation: crackDraw 0.28s ease-out forwards; animation-delay: var(--d); }
@keyframes crackDraw { to { stroke-dashoffset: 0; } }
#ep .shards { display: none; position: absolute; inset: 0; perspective: 1000px; }
#ep.shatter .shards { display: block; }
#ep .shards .shard { position: absolute; inset: 0; transition: transform 0.22s ease-out; }
#ep .shards .shard::after { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent 40%); pointer-events: none; }
#ep .shards .shard .oldcam { display: block; }
#ep .shards .shard * { transition: none !important; animation-play-state: paused !important; }
#ep .shards.split .shard { transform: translate(var(--sx), var(--sy)) rotate(var(--sr)); }
#ep .shards.go .shard { transform: translate3d(var(--tx), var(--ty), var(--tz)) rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(var(--rz)); opacity: 0; transition: transform 1.25s cubic-bezier(0.2, 0.55, 0.3, 1) var(--d), opacity 1.1s var(--d); }
/* 碎桌之后三下重击，每一下闪出新世界的一个碎片画面（台布特写、八人剪影、窗外夜景）；
   接着音乐抽空，一道镜头光横着拉开；最后音乐砸回来、冲击波炸开，切到新牌桌 */
#ep .hit { display: none; position: absolute; inset: 0; background: #000; }
#ep.hiton .hit { display: block; }
#ep .hit .f { position: absolute; inset: 0; display: flex; align-items: flex-end; overflow: hidden; background: radial-gradient(ellipse 60% 80% at var(--fx, 50%) 100%, color-mix(in srgb, var(--cc) 55%, #000), #000 72%); }
#ep .hit .f::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(var(--sa, 100deg), transparent 0 40px, rgba(255,255,255,0.05) 40px 42px); }
#ep .hit .f img { position: relative; filter: brightness(0) drop-shadow(0 0 2px #FFE9B0) drop-shadow(0 0 16px var(--cc)) drop-shadow(0 0 40px rgba(245,196,81,0.55)); }
#ep .hit .f.solo img { width: 620px; margin-bottom: -60px; }
#ep .hit .f.duo img { width: 470px; margin: 0 -40px -40px; }
#ep .hit .f.all { justify-content: center; }
#ep .hit .f.env1 { background: url(backdrop.jpg) 50% 62% / 340% auto; filter: contrast(1.3) saturate(1.3); animation: punch 0.24s cubic-bezier(0.1, 0.8, 0.3, 1) both; }
#ep .hit .f.env2 { background: url(backdrop.jpg) 78% 18% / 300% auto; filter: contrast(1.25) saturate(1.4) hue-rotate(-10deg); animation: punch 0.24s cubic-bezier(0.1, 0.8, 0.3, 1) both; }
#ep .hit .f.env1::before, #ep .hit .f.env2::before { display: none; }
#ep .hit .f.all img { width: 215px; margin: 0 -10px -20px; }
#ep .hit .f.left { justify-content: flex-start; padding-left: 120px; animation: fromL 0.24s cubic-bezier(0.1, 0.8, 0.3, 1) both; }
#ep .hit .f.right { justify-content: flex-end; padding-right: 120px; animation: fromR 0.24s cubic-bezier(0.1, 0.8, 0.3, 1) both; }
#ep .hit .f.mid { justify-content: center; animation: punch 0.24s cubic-bezier(0.1, 0.8, 0.3, 1) both; }
#ep .hit .f.all { animation: punch 0.35s cubic-bezier(0.1, 0.8, 0.3, 1) both; }
@keyframes punch { from { transform: scale(1.3); filter: brightness(2.4); } to { transform: scale(1); } }
@keyframes fromL { from { transform: translateX(-260px) skewX(-8deg); filter: brightness(2); } to { transform: none; } }
@keyframes fromR { from { transform: translateX(260px) skewX(8deg); filter: brightness(2); } to { transform: none; } }
#boomring { position: absolute; left: 50%; top: 46%; width: 300px; height: 300px; margin: -150px 0 0 -150px; border-radius: 50%; z-index: 121; pointer-events: none; opacity: 0; box-shadow: 0 0 0 18px rgba(255,255,255,0.9), 0 0 60px 30px rgba(255,214,140,0.6), inset 0 0 60px 20px rgba(255,214,140,0.5); }
#boomring.go { animation: boom 0.75s cubic-bezier(0.1, 0.7, 0.2, 1) both; }
@keyframes boom { from { transform: scale(0.1); opacity: 1; } to { transform: scale(7); opacity: 0; } }
#stage.revealblur #world { animation: unblur 0.7s ease-out both; }
@keyframes unblur { from { filter: blur(14px) brightness(1.8); } to { filter: none; } }
/* 收尾：牌桌慢慢暗下去，镜头往后拉 */
#stage.dusk #world { filter: brightness(0.35) saturate(0.8); transition: filter 3s; }
#ep.blackout { background: #000; transition: background 0.8s; }
#ep .endcard { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.4s; }
#ep.endon .endcard { opacity: 1; }
#ep .sweep { display: none; position: absolute; inset: 0; background: #05060B; }
#ep.sweepon .sweep { display: block; }
#ep .streak { position: absolute; left: 0; right: 0; top: 50%; height: 6px; margin-top: -3px; background: linear-gradient(90deg, transparent, rgba(120,180,255,0.6) 20%, #FFF 50%, rgba(120,180,255,0.6) 80%, transparent); box-shadow: 0 0 24px 6px rgba(140,190,255,0.7), 0 0 90px 30px rgba(90,150,255,0.35); transform: scaleX(0); }
#ep.sweepon .streak { animation: streak 0.8s cubic-bezier(0.7, 0, 0.2, 1) both; }
@keyframes streak { 0% { transform: scaleX(0) scaleY(0.6); opacity: 0.6; } 60% { transform: scaleX(1) scaleY(1); opacity: 1; } 100% { transform: scaleX(1.2) scaleY(22); opacity: 1; filter: brightness(2); } }
#ep .flash { position: absolute; inset: 0; background: #FFF; opacity: 0; transition: opacity 0.6s; }
#ep.flashon .flash { opacity: 1; transition: none; }
#ep.ttlon .ttl { display: flex; }
#ep .ttl { position: absolute; inset: 0; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(ellipse 70% 55% at 50% 48%, rgba(5,6,11,0.8), rgba(5,6,11,0.3) 70%, transparent); }
#ep .ttl .t1 { position: relative; display: flex; font-family: var(--brush); font-size: 150px; line-height: 1; color: var(--gold); text-shadow: 6px 6px 0 #000; }
#ep .ttl .t1 i { font-style: normal; display: inline-block; animation: charDrop 0.42s cubic-bezier(0.2, 1.5, 0.4, 1) both; animation-delay: calc(var(--i) * 90ms + 100ms); }
@keyframes charDrop { from { transform: translateY(-260px) rotate(-18deg) scale(1.6); opacity: 0; } to { transform: none; opacity: 1; } }
#ep .ttl .t1::after { content: ""; position: absolute; inset: -10px -30px; background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.75) 50%, transparent 60%); mix-blend-mode: overlay; transform: translateX(-120%); animation: shine 0.9s 1.2s ease-in-out both; }
@keyframes shine { to { transform: translateX(120%); } }
#ep .ttl .t2 { font-family: var(--display); font-size: 46px; letter-spacing: 12px; color: #05060B; background: var(--hot); padding: 4px 26px; transform: rotate(-3deg); box-shadow: 6px 6px 0 #000; animation: stamp 0.4s 1.05s cubic-bezier(0.2, 1.6, 0.4, 1) both; }
@keyframes stamp { from { transform: rotate(-3deg) scale(3); opacity: 0; } to { transform: rotate(-3deg) scale(1); opacity: 1; } }
/* 新牌桌出现时，八个座位一个个落下来 */
#stage.seatsin .seat { animation: seatIn 0.55s cubic-bezier(0.2, 1.4, 0.4, 1) both; animation-delay: calc(var(--i) * 130ms + 250ms); }
@keyframes seatIn { from { transform: translate(-50%, -170%) scale(var(--sc)); opacity: 0; } to { transform: translate(-50%, -100%) scale(var(--sc)); opacity: 1; } }
@keyframes slamIn { from { transform: scale(2.6); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes popUp { from { transform: translateY(80px) scale(0.8); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes slideL { from { transform: translateX(140px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
#ep.lineon { background: #05060B; }
#ep.lineon .lineup { display: flex; }
#ep .lineup { position: absolute; inset: 0 0 160px; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
#ep .lineup .t2, #ep .outro .t2 { font-family: var(--display); font-size: 40px; letter-spacing: 10px; }
#ep .lineup .t2 { animation: slamIn 0.45s cubic-bezier(0.2, 1.6, 0.4, 1) both; }
#ep .lineup .row, #ep .outro .row { display: flex; gap: 10px; }
#ep .outro figure { animation: popUp 0.45s cubic-bezier(0.2, 1.4, 0.4, 1) both; animation-delay: calc(var(--i) * 90ms + 300ms); }
#ep .outro .t1 { animation: slamIn 0.5s cubic-bezier(0.2, 1.6, 0.4, 1) both; }
#ep .lineup figure, #ep .outro figure { margin: 0; width: 170px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
#ep .lineup figure { animation: popUp 0.45s cubic-bezier(0.2, 1.4, 0.4, 1) both; animation-delay: calc(var(--i) * 90ms + 200ms); }
#ep .lineup figure img, #ep .outro figure img { width: 170px; height: 220px; object-fit: cover; object-position: top; border-bottom: 4px solid var(--cc); }
#ep .lineup figcaption, #ep .outro figcaption { font-family: var(--display); font-size: 22px; color: var(--cc); }
/* 选手登场：色带横扫进来，立绘带回弹冲进来，名字砸下来，型号和介绍从右边滑进来；换人时立绘往右甩出去 */
#ep.caston { background: #05060B; }
#ep.caston .cast { display: block; }
#ep .cast { position: absolute; inset: 0; }
#ep .cast::before { content: ""; position: absolute; left: -120px; top: 0; width: 900px; height: 100%; background: repeating-linear-gradient(135deg, rgba(5,6,11,0.16) 0 8px, transparent 8px 22px), var(--cc); clip-path: polygon(0 0, 100% 0, 78% 100%, 0 100%); }
#ep .cast::before { animation: stripes 1.4s linear infinite; }
#ep .cast.go::before { animation: wipe 0.45s cubic-bezier(0.7, 0, 0.2, 1) both, stripes 1.4s linear infinite; }
@keyframes stripes { to { background-position: 31.1px 0, 0 0; } }
@keyframes wipe { from { clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); } to { clip-path: polygon(0 0, 100% 0, 78% 100%, 0 100%); } }
#castimg { position: absolute; left: 90px; top: 40px; width: 620px; filter: drop-shadow(0 18px 24px rgba(0,0,0,0.6)); }
#ep .cast .info { position: absolute; left: 860px; top: 150px; right: 80px; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
#castname { font-family: var(--brush); font-weight: 400; font-size: 132px; line-height: 1; color: var(--cc); text-shadow: 5px 5px 0 #000; transform-origin: left center; }
#castmodel { font: 500 30px var(--num); letter-spacing: 3px; color: var(--text); }
#castimage { margin: 0; font-size: 26px; line-height: 1.6; color: #C8CBD6; max-width: 640px; }
#ep .cast.go #castimg { animation: castIn 0.55s 0.1s cubic-bezier(0.2, 1.3, 0.3, 1) both, float 2.6s 0.7s ease-in-out infinite alternate; }
@keyframes float { from { transform: none; } to { transform: translateY(-12px) rotate(0.6deg); } }
#ep .cast.go #castname { animation: slamIn 0.45s 0.25s cubic-bezier(0.2, 1.6, 0.4, 1) both; }
#ep .cast.go #castmodel { animation: slideL 0.4s 0.4s both; }
#ep .cast.go #castimage { animation: slideL 0.4s 0.5s both; }

// ---------- casino chips: denominations stacked in columns ----------
const DENOMS = [[1000, '#D4A11E'], [500, '#6A38A6'], [100, '#24252F'], [25, '#1C7C4C'], [5, '#B3233A']];
function chipsSVG(amount, maxCols = 3) {
  let rest = amount;
  const cols = [];
  for (const [v, c] of DENOMS) { const n = Math.floor(rest / v); if (n > 0) { cols.push({ n: Math.min(n, 12), c }); rest -= n * v; } }
  const use = cols.slice(0, maxCols);
  if (!use.length) return '';
  const cw = 30, th = 4, h = Math.max(...use.map(c => c.n)) * th + 15, w = use.length * cw + 2;
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">`;
  use.forEach((col, ci) => {
    const x = ci * cw + 16;
    for (let k = 0; k < col.n; k++) {
      const y = h - 7 - k * th;
      s += `<ellipse cx="${x}" cy="${y}" rx="14" ry="6" fill="${shade(col.c, -0.45)}"/><rect x="${x - 14}" y="${y - th}" width="28" height="${th}" fill="${shade(col.c, -0.2)}"/>`
        + `<rect x="${x - 10.5}" y="${y - th}" width="3" height="${th}" fill="#EDE6D6"/><rect x="${x - 1.5}" y="${y - th}" width="3" height="${th}" fill="#EDE6D6"/><rect x="${x + 7.5}" y="${y - th}" width="3" height="${th}" fill="#EDE6D6"/>`;
    }
    const ty = h - 7 - col.n * th;
    s += `<ellipse cx="${x}" cy="${ty}" rx="14" ry="6" fill="${col.c}"/><ellipse cx="${x}" cy="${ty}" rx="11.6" ry="4.9" fill="none" stroke="#EDE6D6" stroke-width="2.2" stroke-dasharray="3 4.3"/>`
      + `<ellipse cx="${x}" cy="${ty}" rx="7.6" ry="3.2" fill="${shade(col.c, 0.15)}" stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/><ellipse cx="${x - 3}" cy="${ty - 1.6}" rx="5" ry="1.2" fill="rgba(255,255,255,0.18)"/>`;
  });
  return s + '</svg>';
}

function sleep(ms) {

  });
}
// 估算时长时 CLOCK 不为空：W 不真的等，只把时长记到 CLOCK.t 上

function cardEl(code, size) {

  return el('div', `card ${size}${red ? ' red' : ''}`, `<div class="in"><div class="face back"></div><div class="face front"><div class="ix"><b>${r}</b><i>${s}</i></div><div class="pip">${s}</div></div></div>`);
}
function place(e, x, y, rot = 0) { e.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`; }

async function deal() {
  const n = G.length, btn = Math.max(0, LOG.players.findIndex(p => p.id === LOG.button));
  const order = Array.from({ length: n }, (_, k) => (btn + 1 + k) % n);
  for (let round = 0; round < 2; round++) {
    for (const i of order) {
      const g = G[i];
      if (!g.cards || !g.cards[round]) continue;
      const c = cardEl(g.cards[round], 'sm');
      place(c, CX - 22, CY - 31); dyn.append(c); c.getBoundingClientRect();
      place(c, g.hx - 22 + (round ? 13 : -13), g.hy - 31, round ? 6 : -6);
      g.cardEls.push(c);
      sfx('deal', 0.8);
      await W(60);
    }
  }
  await W(250);
  sfx('flip', 0.7);
  for (const i of order) { G[i].cardEls.forEach(c => c.classList.add('up')); await W(50); }
  const k = G[btn], d = el('div', 'dbtn', 'D');
  d.style.left = k.hx + 'px'; d.style.top = (k.hy - 56) + 'px';
  dyn.append(d);
}

async function board(ev) {

    place(c, CX - 34, CY - 48); dyn.append(c); c.getBoundingClientRect();
    place(c, 602 + k * 82, 372);
    boardEls[k] = c;

    await W(220);
    c.classList.add('up');
    sfx('flip', ev.river ? 1.3 : 1);

}

function setBet(i, total) {

async function collect() {

function apply(i, ev) {

  else if (ev.a === 'check') { tag(i, 'quiet', '过牌', 1100); sfx('check'); }
  else {

}

// ---------- sound: 背景音乐和音效（Web Audio）。浏览器要先在页面上点一下才会出声 ----------
const SFX_GAIN = { deal: 1.4, flip: 1.0, chips: 0.8, allin_chips: 0.9, collect: 1.1, check: 0.9, fold: 2.6, impact: 0.6, allin_sting: 0.8, allin_shout: 1.6, win: 0.7, whoosh: 0.9, slam: 0.7, glass_crack: 0.9, glass_break: 0.9 };
// 全下特写里的喊声：每个角色自己的声音（sfx/allin_<id>.mp3），没有的用解说的喊声
for (const id of ['claude', 'gpt', 'gemini', 'deepseek', 'qwen', 'grok', 'kimi', 'doubao']) SFX_GAIN[`allin_${id}`] = 1.4;
const MUSIC_VOL = 0.3, MUSIC_DUCKED = 0.13;
const AC = new (window.AudioContext || window.webkitAudioContext)();
const master = AC.createGain(), music = AC.createGain(), fx = AC.createGain();
music.gain.value = MUSIC_VOL;
music.connect(master); fx.connect(master); master.connect(AC.destination);
// 背景音乐和片头主题曲各走一路，片头时主题曲顶上来、爵士乐退下去
const bgmGain = AC.createGain(), themeGain = AC.createGain();
themeGain.gain.value = 0;
bgmGain.connect(music); themeGain.connect(music);
let themeSrc = null, themeOn = false;
// 片头片尾的转场音效整体压低，不盖过旁白和主题曲
function fxLevel(v) { fx.gain.setTargetAtTime(v, AC.currentTime, 0.05); }
function musicFade(out) {
  if (CLOCK || AC.state !== 'running') return;
  music.gain.cancelScheduledValues(AC.currentTime);
  music.gain.setTargetAtTime(out ? 0 : MUSIC_VOL, AC.currentTime, out ? 0.3 : 0.05);
}
function musicDrop(on) {
  if (CLOCK || !themeOn || AC.state !== 'running') return;
  const t = AC.currentTime;
  themeGain.gain.cancelScheduledValues(t);
  if (on) themeGain.gain.setTargetAtTime(0.08, t, 0.06);
  else themeGain.gain.setValueAtTime(1.3, t);
}
const BUF = {};
let bgm = null, muted = false;
async function loadSound(name) {
  try { BUF[name] = await AC.decodeAudioData(await (await fetch(`sfx/${name}.mp3`)).arrayBuffer()); } catch (e) { /* 少一个音效不影响回放 */ }
}
Promise.all([...Object.keys(SFX_GAIN), 'bgm', 'theme'].map(loadSound)).then(startMusic);
// 音效每次音高和音量稍微抖一下，连着发牌不会像复读
function sfx(name, gain = 1) {
  if (FF || CLOCK || !BUF[name] || AC.state !== 'running') return;
  const src = AC.createBufferSource(), g = AC.createGain();
  src.buffer = BUF[name];
  src.playbackRate.value = SPEED * (0.95 + Math.random() * 0.1);
  g.gain.value = SFX_GAIN[name] * gain * (0.9 + Math.random() * 0.2);
  src.connect(g); g.connect(fx); src.start();
}
// 背景音乐循环播放，跳过开头的起音和结尾的收尾
function startMusic() {
  if (bgm || !BUF.bgm || AC.state !== 'running') return;
  bgm = AC.createBufferSource();
  bgm.buffer = BUF.bgm; bgm.loop = true; bgm.loopStart = 1; bgm.loopEnd = BUF.bgm.duration - 3;
  bgm.connect(bgmGain); bgm.start();
}
function theme(on) {
  if (CLOCK || !BUF.theme || AC.state !== 'running') return;
  const t = AC.currentTime;
  if (on) {
    if (themeSrc) { try { themeSrc.stop(); } catch (e) { /* 已经停了 */ } }
    themeSrc = AC.createBufferSource();
    themeSrc.buffer = BUF.theme;
    themeSrc.connect(themeGain);
    themeSrc.start();
    themeGain.gain.setValueAtTime(1.2, t);
    bgmGain.gain.setTargetAtTime(0, t, 0.15);

  } else {

    themeGain.gain.setTargetAtTime(0, t, 0.8);
    bgmGain.gain.setTargetAtTime(1, t, 0.8);
  }
}

// ---------- voice: 配好的台词和心声（/voice/<手牌id>/manifest.json，按事件序号对上） ----------
let VOICE = {};
const vo = new Audio();
async function loadVoice(log) {
  VOICE = {};
  try {
    const res = await fetch(`/voice/${encodeURIComponent(log.id)}/manifest.json`);
    if (res.ok) VOICE = await res.json();
  } catch (e) { /* 没有配音就只放字幕 */ }
}
function voiceSrc(k, kind) {
  const v = VOICE[k] && VOICE[k][kind];
  return v ? `/voice/${encodeURIComponent(LOG.id)}/${v.file}` : null;
}
function hush() { vo.pause(); vo.removeAttribute('src'); }
// 有配音时边放边打字，打字速度跟着音频长度走，放完再往下；没有配音（或浏览器还不让出声）就照常打字
// 配音播放时统一快一点，浏览器默认保持音调
const VOICE_RATE = 1.1;
const DUR = {};
function audioLength(src) {
  if (DUR[src] != null) return Promise.resolve(DUR[src]);
  return new Promise(res => {
    const a = new Audio();
    a.preload = 'metadata';
    a.onloadedmetadata = () => res(DUR[src] = a.duration * 1000 / VOICE_RATE);
    a.onerror = () => res(DUR[src] = 0);
    a.src = src;
  });
}
async function speak(node, txt, ms, src) {
  if (CLOCK && src) {
    const d = await audioLength(src);
    if (d) { CLOCK.t += d; node.textContent = txt; return; }
  }
  if (!src || FF || CLOCK) return type(node, txt, ms);
  vo.src = src;
  vo.playbackRate = SPEED * VOICE_RATE;
  const dur = await new Promise(res => { vo.onloadedmetadata = () => res(vo.duration * 1000 / VOICE_RATE); vo.onerror = () => res(0); });
  if (!dur) return type(node, txt, ms);
  try { await vo.play(); } catch (e) { return type(node, txt, ms); }
  duck(true);
  try {
    await type(node, txt, Math.min(ms, dur * 0.8 / Math.max(1, txt.length)));
    while (!vo.ended && !vo.error) await W(50);
  } finally {
    duck(false);
  }
}

async function act(ev) {
  const i = ev.p;
  on(i, true); tag(i, 'think', '思考中');
  await W(ev.full ? 600 : ev.show === 'none' ? 120 : 300);
  untag(i);
  // 模型没给出有效决策时由系统按规则代打，直接标出来，不演台词

    apply(i, ev);
    barAction(i, `系统代打 · ${ACT_CN[ev.a] || ev.a}`);
    tag(i, 'quiet', '系统代打', 1600);
    await W(900);
    on(i, false);
    return;
  }
  // 先说话（或先在心里盘算），再出手；只有全下反过来，先放特写再说话
  if (ev.cut) {
    apply(i, ev);
    tick(`${G[i].name} 全下 ${fmt(ev.to)}！`);
    await allinCut(i, ev.to);
    if (ev.sp || ev.in) await say(i, ev.sp, ev.in, true, false, ev.ev);

    on(i, false);
    await say(i, ev.sp, ev.in, true, false, ev.ev);
    apply(i, ev);

  } else {

}

async function step(ev) {
  switch (ev.t) {
    case 'deal': await deal(); break;
    case 'blinds':
      if (ev.sb) setBet(ev.sb.p, ev.sb.amount);
      if (ev.bb) setBet(ev.bb.p, ev.bb.amount);
      street('翻牌前');
      await W(250);
      break;
    case 'act': await act(ev); break;
    case 'collect': await collect(); break;
    case 'board': await board(ev); break;
    case 'show': await show(); break;
    case 'post': await say(ev.p, ev.sp, '', false, false, ev.ev); break;
    case 'end':
      renderStats('本手结束 · 筹码变化');
      camHome(2400);
      await W(800);
      if (FF) break;
      if (CLOCK || EP) break;
      if ($('#autonext').checked && CUR < LIST.length - 1) { await W(800); selectHand(CUR + 1); }
      else $('#end').classList.add('show');
      break;
  }
}

async function loadList() {
  try {
    const res = await fetch('/api/hands');
    if (!res.ok) throw new Error(res.status);
    const hands = await res.json();
    if (!Array.isArray(hands) || !hands.length) throw new Error('empty');
    // 同一场按手数排；并行跑出来的手完成顺序不固定，不能按开始时间排
    hands.sort((a, b) => String(a.session).localeCompare(String(b.session)) || a.hand - b.hand);
    LIST = hands;
    $('#src').textContent = `共 ${hands.length} 手已记录`;
  } catch (error) {
    LIST = [{ id: SAMPLE.id, hand: SAMPLE.hand, session: SAMPLE.session, log: SAMPLE, winners: [{ name: '狂客', amount: 14700 }] }];
    $('#src').textContent = '还没有连上后端，正在播放示例手牌';

  LIST.forEach((h, k) => {
    const w = (h.winners || []).map(x => `${x.name} +${fmt(x.amount)}`).join('、');
    sel.append(new Option(`第 ${h.hand} 手${h.title ? '「' + h.title + '」' : ''}${w ? ' · ' + w : ''}`, String(k)));
  });
  // 默认从最近一场的第一手开始看
  const lastSession = LIST[LIST.length - 1].session;
  const want = location.hash.slice(1);
  let k = LIST.findIndex(h => h.id === want);
  if (k === -1) k = LIST.findIndex(h => h.session === lastSession);
  selectHand(Math.max(0, k));
}

// ---------- 视频时长估算：这一场每手按 1× 速度要放多久（含开场和配音），估完回到原来那手 ----------
const mmss = ms => `${Math.floor(ms / 60000)}:${String(Math.round(ms / 1000) % 60).padStart(2, '0')}`;
async function estimate() {
  const btn = $('#est'), keep = CUR, wasFirst = FIRST;
  btn.disabled = true;
  stage.classList.add('measuring');
  const rows = [];
  const hands = LIST.filter(h => h.session === LIST[keep].session);
  try {
    for (const [n, item] of hands.entries()) {
      btn.textContent = `估算中 ${n + 1}/${hands.length}`;
      const log = item.log || await (await fetch(`/api/hands/${encodeURIComponent(item.id)}`)).json();
      LOG = log;
      await loadVoice(log);
      ({ shots: SHOTS, chaps: CHAPS } = direct(log));
      buildChaps();
      FIRST = false;
      CLOCK = { t: 0 };
      await start(0);
      rows.push({ hand: log.hand, title: log.title, ms: CLOCK.t });
      CLOCK = null;
    }
  } finally {
    CLOCK = null;
    FIRST = wasFirst;
    stage.classList.remove('measuring');
    btn.disabled = false;
    btn.textContent = '重新估算视频时长';
  }
  const total = rows.reduce((a, r) => a + r.ms, 0);
  $('#durlist').innerHTML = `<table>${rows.map(r => `<tr><td>第 ${r.hand} 手</td><td>${esc(r.title || '')}</td><td class="t">${mmss(r.ms)}</td></tr>`).join('')}`
    + `<tr class="sum"><td>合计</td><td>${rows.length} 手，1× 速度，不含片头片尾</td><td class="t">${mmss(total)}</td></tr></table>`;
  selectHand(keep);
}

  sfx('whoosh');
  later(260, () => sfx('slam', 0.6));
}

// 片头里跟着旁白走的定时动画：只在本轮片头里生效，估算时长时不跑
function later(ms, fn) { const tok = run; setTimeout(() => { if (tok === run && !CLOCK) fn(); }, ms / SPEED); }

// 片头：铁皮回顾第一季（旧界面慢推，说到“一大段文字”时思考面板放大）→ 说“所以——”的同时界面被拆：
// 面板、按钮、头像、牌依次飞出，旧跑道桌变成新的椭圆牌桌 → 闪白，新牌桌出现、座位一个个落下、片名砸下来
// → 八人阵容 → 每人冲进来用自己的声音自我介绍 → 铁皮：发牌
async function epIntro() {
  const ep = $('#ep'), n = EP.narration, old = $('#old'), oc = $('#oldcam'), intro = n.intro || [];
  const line = k => intro[k] ? narrate('laok', intro[k], showSrc(`intro${k}`)) : W(0);
  $('#eptitle').textContent = EP.title;
  $('#ept1').innerHTML = [...'大模型终极德州之战'].map((ch, k) => `<i style="--i:${k}">${ch}</i>`).join('');
  buildOld();
  oc.className = 'oldcam';
  oc.style.visibility = '';
  // 冷开场：黑底，音乐直接起，铁皮在正中间开口
  ep.className = 'on dark';
  fxLevel(0.45);
  theme(true);
  $('#laok').classList.add('center');
  laok(true);
  sfx('slam', 0.7);
  await W(700);
  await line(0);
  // 说到“做了这么个东西”：旧界面闪进来，铁皮挪到右上角
  later(2500, () => {
    ep.className = 'on oldon';
    old.classList.add('popin');
    $('#laok').classList.remove('center');
    sfx('whoosh');
    later(80, () => old.classList.add('drift'));
  });
  await line(1);
  // “闷头打牌，一句话都不说”：镜头推到牌桌，八个头像挨个亮一下、冒“……”
  oc.classList.add('cam-table');
  old.classList.add('pulse');
  await line(2);
  // “只能翻右边这一大段文字”：镜头摇到思考面板，字飞快往上滚
  oc.classList.remove('cam-table');
  oc.classList.add('cam-think');
  old.classList.add('read');
  await line(3);
  // “模型换了好几代……”：镜头拉回全景，面板、按钮、头像和牌一样样飞走，旧牌桌开始闪故障
  oc.classList.remove('cam-think');
  old.classList.remove('read', 'pulse');
  later(500, () => { old.classList.add('b1'); sfx('whoosh'); });
  later(1100, () => { old.classList.add('b2'); sfx('whoosh'); });
  later(1700, () => { old.classList.add('b3'); sfx('whoosh', 1.2); });
  later(2600, () => old.classList.add('b5'));
  await line(4);
  // “所以——”：一拳下去整屏裂开，裂缝张开，炸碎，直接接三下重击
  later(150, () => crack());
  await line(5);
  await glassBreak();
  // 碎完：一串金边剪影，左右交替甩进来、一拍比一拍快（唰唰唰唰），最后八个人一起砸出来（啪）
  const hit = $('#hit');
  const byId = Object.fromEntries(CAST.map(c => [c.id, c]));
  // 人物剪影中间穿插两张新世界的环境碎片（台布特写、窗外夜景）
  const beats = [[['claude'], 'left'], ['env1'], [['grok'], 'right'], [['gemini', 'doubao'], 'mid'], ['env2'],
    [['deepseek'], 'left'], [['gpt'], 'right'], [['kimi', 'qwen'], 'mid']];
  const beatMs = [300, 240, 250, 220, 200, 185, 170, 160];
  const frame = (ids, side, cls) => {
    const c = byId[ids[0]] || CAST[0];
    const fx = side === 'left' ? '30%' : side === 'right' ? '70%' : '50%';
    hit.innerHTML = `<div class="f ${cls} ${side}" style="--cc:${c.color};--fx:${fx};--sa:${side === 'right' ? 80 : 100}deg">`
      + ids.filter(id => byId[id]).map(id => `<img src="portraits/${id}.png" alt="">`).join('') + '</div>';
  };
  ep.className = 'on hiton';
  for (const [k, [ids, side]] of beats.entries()) {
    if (typeof ids === 'string') hit.innerHTML = `<div class="f ${ids}"></div>`;
    else frame(ids, side, ids.length > 1 ? 'duo' : 'solo');
    sfx('whoosh', 0.7); sfx('slam', 0.55 + k * 0.05);
    await W(beatMs[k]);
    hit.innerHTML = '';
    await W(40);
  }
  frame(CAST.map(c => c.id), 'mid', 'all');
  sfx('slam', 1.1); sfx('impact', 0.9);
  await W(520);
  hit.innerHTML = '';
  // 音乐抽空，镜头光拉开，憋一口气
  musicDrop(true);
  ep.className = 'on sweepon';
  sfx('whoosh', 1.4);
  await W(760);
  // 砸！音乐回来、冲击波、闪白，新牌桌从特写里拉开，座位一个个砸下来，片名逐字落下
  musicDrop(false);
  ep.className = 'on flashon';
  sfx('slam', 1.2); sfx('impact', 1.2); sfx('allin_sting', 0.5);
  const ring = $('#boomring');
  ring.classList.remove('go'); void ring.offsetWidth; ring.classList.add('go');
  stage.classList.remove('revealblur'); void stage.offsetWidth; stage.classList.add('revealblur');
  stage.classList.add('seatsin');
  G.forEach((g, i) => later(250 + i * 130, () => sfx('chips', 0.6)));
  cam(800, 400, 2.4, 0);
  await W(60);
  ep.className = 'on ttlon';
  cam(800, 390, 1.0, 900);
  if (!REDUCED) later(120, () => { world.classList.remove('shake'); void world.offsetWidth; world.classList.add('shake'); });
  [...'大模型终极德州之战'].forEach((_, k) => later(100 + k * 90, () => sfx('deal', 1.2)));
  later(1050, () => sfx('slam', 0.8));
  await W(900);
  camHome(5000);
  await W(1200);
  for (const [k, t] of (n.title || []).entries()) await narrate('laok', t, showSrc(`title${k}`));
  $('#lineup').innerHTML = lineupHTML();
  ep.className = 'on lineon';
  sfx('whoosh');
  CAST.forEach((c, k) => later(200 + k * 90, () => sfx('chips', 0.5)));
  if (n.cast) await narrate('laok', n.cast, showSrc('cast'));
  $('#laoksay').classList.remove('show');
  for (const [i, c] of CAST.entries()) {
    $('#epsub').classList.remove('show');
    ep.className = 'on caston';
    await castShow(c, i === 0);
    await W(500);
    const self = EP.selfIntro[c.id];
    if (self) await narrate(c.id, self, showSrc(`self-${c.id}`));
    else await W(900);
  }
  $('#epsub').classList.remove('show');
  ep.className = 'on';
  stage.classList.remove('seatsin');
  if (n.go) await narrate('laok', n.go, showSrc('go'));
  theme(false);
  fxLevel(1);
  ep.className = '';
  laok(false);
  await W(300);
}

// 整屏碎裂：以冲击点为中心，按角度切成扇形、按半径切成几圈，得到一片片多边形
let SHARDS = [];
function crackPolys(ix, iy) {
  const N = 13, R = [0, 85, 230, 450, 780, 2300];
  const ang = Array.from({ length: N }, (_, k) => (k + Math.random() * 0.6 - 0.3) / N * Math.PI * 2);
  const jit = R.map(() => ang.map(() => 0.82 + Math.random() * 0.36));
  const pt = (a, r, j) => [Math.round(ix + Math.cos(a) * r * j), Math.round(iy + Math.sin(a) * r * j)];
  const polys = [];
  for (let r = 0; r < R.length - 1; r++) {
    for (let k = 0; k < N; k++) {
      const k1 = (k + 1) % N, a0 = ang[k], a1 = ang[k1] + (k1 === 0 ? Math.PI * 2 : 0);
      const p = r === 0 ? [[ix, iy]] : [pt(a0, R[r], jit[r][k]), pt(a1, R[r], jit[r][k1])];
      p.push(pt(a1, R[r + 1], jit[r + 1][k1]), pt(a0, R[r + 1], jit[r + 1][k]));
      polys.push({ p, r, mid: (a0 + a1) / 2 });
    }
  }
  // 裂纹：放射状的主裂纹每条都画，环向的小裂纹只随机画一部分，看起来像真的玻璃裂而不是蜘蛛网
  const lines = ang.map((a, k) => R.slice(1, -1).map((r, i) => pt(a, r, jit[i + 1][k])));
  lines.forEach(l => l.unshift([ix, iy]));
  for (let r = 1; r < R.length - 2; r++) {
    for (let k = 0; k < N; k++) {
      if (Math.random() < (r === 1 ? 0.85 : 0.35)) lines.push([pt(ang[k], R[r], jit[r][k]), pt(ang[(k + 1) % N] + ((k + 1) % N === 0 ? Math.PI * 2 : 0), R[r], jit[r][(k + 1) % N])]);
    }
  }
  polys.lines = lines;
  return polys;
}

// 第一下：裂纹从冲击点画出去，画面一震
function crack() {
  SHARDS = crackPolys(820, 430);
  $('#cracks').innerHTML = SHARDS.lines.map((l, k) => `<path style="--d:${k < 13 ? 0 : 90}ms" d="M${l.map(q => q.join(' ')).join(' L')}"/>`).join('');
  const ep = $('#ep');
  ep.classList.add('cracked');
  ep.classList.remove('jolt'); void ep.offsetWidth; ep.classList.add('jolt');
  sfx('glass_crack'); sfx('slam', 0.7);
}

// 第二下裂缝张开，第三下整屏朝镜头炸开
async function glassBreak() {
  const ep = $('#ep'), box = $('#shards');
  if (!SHARDS.length) SHARDS = crackPolys(820, 430);
  const snap = $('#oldcam').cloneNode(true);
  snap.removeAttribute('id');
  snap.querySelectorAll('[id]').forEach(e => e.removeAttribute('id'));
  box.className = 'shards';
  box.innerHTML = '';
  for (const sh of SHARDS) {
    const d = document.createElement('div');
    const out = 260 + sh.r * 260 + Math.random() * 200;
    d.className = 'shard';
    d.style.cssText = `clip-path:polygon(${sh.p.map(([x, y]) => `${x}px ${y}px`).join(',')});`
      + `--sx:${(Math.cos(sh.mid) * (5 + sh.r * 4)).toFixed(1)}px;--sy:${(Math.sin(sh.mid) * (5 + sh.r * 4)).toFixed(1)}px;--sr:${(Math.random() * 2 - 1).toFixed(2)}deg;`
      + `--tx:${Math.round(Math.cos(sh.mid) * out)}px;--ty:${Math.round(Math.sin(sh.mid) * out + 260)}px;--tz:${Math.round(200 + Math.random() * 600)}px;`
      + `--rx:${Math.round(Math.random() * 140 - 70)}deg;--ry:${Math.round(Math.random() * 140 - 70)}deg;--rz:${Math.round(Math.random() * 200 - 100)}deg;--d:${sh.r * 35}ms;`;
    d.append(snap.cloneNode(true));
    box.append(d);
  }
  $('#oldcam').style.visibility = 'hidden';
  ep.classList.remove('cracked');
  ep.classList.add('shatter', 'dark');
  void box.offsetWidth;
  box.classList.add('split');
  sfx('glass_crack', 0.8);
  await W(260);
  box.classList.add('go');
  sfx('glass_break'); sfx('impact', 0.8);
  await W(520);
}

async function epOutro() {
  const ep = $('#ep'), out = EP.narration.outro || [];
  fxLevel(0.45);
  theme(true);
  laok(true);
  stage.classList.add('eponly', 'dusk');
  cam(800, 380, 0.86, 5000);
  ep.className = 'on';
  await W(1200);
  for (const [k, t] of out.slice(0, -1).entries()) await narrate('laok', t, showSrc(`outro${k}`));
  $('#laoksay').classList.remove('show');
  $('#outrocast').innerHTML = lineupHTML();
  ep.className = 'on outon';
  sfx('whoosh');
  CAST.forEach((c, k) => later(300 + k * 90, () => sfx('chips', 0.5)));
  await W(1200);
  if (out.length) await narrate('laok', out[out.length - 1], showSrc(`outro${out.length - 1}`));
  await W(1200);
  // 音乐提前一秒淡出，黑一下，接频道片尾
  musicFade(true);
  await W(1000);
  laok(false);
  ep.className = 'on blackout';
  await W(400);
  await endCard();
}

async function endCard() {
  const v = $('#endcard');
  if (CLOCK) { CLOCK.t += (v.duration || 7.9) * 1000; return; }
  $('#ep').className = 'on endon';
  v.currentTime = 0;
  v.muted = muted;
  v.playbackRate = SPEED;
  try { await v.play(); } catch (e) { await W(7900); return; }
  while (!v.ended && !v.error) await W(100);
}

async function epSegment(i, me) {
  const it = EP.items[i];
  EP.idx = i; EP.segT = 0;
  await epPrepare(it.kind === 'hand' ? it.pos : it.kind === 'intro' ? 1 : EP.hands.length);
  if (me !== EPRUN) return;
  $('#epsub').classList.remove('show');
  $('#handcard').classList.remove('show');
  stage.classList.remove('seatsin', 'dusk', 'revealblur');
  laok(false);
  $('#endcard').pause();
  musicFade(false);
  if (it.kind === 'hand') {
    theme(false);
    fxLevel(1);
    $('#ep').className = '';
    stage.classList.remove('eponly');
    FIRST = false;
    await start(0);
    return;
  }
  run++; hush(); reset();
  stage.classList.add('eponly');
  try { await (it.kind === 'intro' ? epIntro() : epOutro()); } catch (e) { if (e !== STOP) throw e; }
  if (it.kind === 'intro' && me === EPRUN) stage.classList.remove('eponly');
}

async function epRun(from) {
  const me = ++EPRUN;
  for (let i = from; i < EP.items.length; i++) {
    await epSegment(i, me);
    if (me !== EPRUN) return;
  }
}

function epGo(i) {
  paused = false; stage.classList.remove('paused'); pauseBtn.textContent = '暂停';
  run++; hush();
  epRun(i);
}

// 按 1× 速度把每一段用虚拟时钟走一遍，得到时间轴上每段的长度
async function epMeasure() {
  const me = ++EPRUN;
  run++; hush();
  stage.classList.add('measuring');
  EP.durs = [];
  try {
    for (let i = 0; i < EP.items.length; i++) {
      CLOCK = { t: 0 };
      await epSegment(i, me);
      EP.durs.push(CLOCK.t);
    }
  } finally {
    CLOCK = null;
    $('#ep').className = '';
    stage.classList.remove('measuring');
  }
}

function epBuildTimeline() {
  $('#segs').innerHTML = '';
  EP.items.forEach((it, i) => {
    const b = el('button', 'seg', `<i></i><span>${esc(it.label)}</span>`);
    b.type = 'button';
    b.title = `${it.label} · ${mmss(EP.durs[i])}`;
    b.style.flex = `${Math.max(EP.durs[i], 1)} 1 0`;
    b.addEventListener('click', () => epGo(i));
    $('#segs').append(b);
  });
}

function epDraw() {
  const total = EP.durs.reduce((a, b) => a + b, 0);
  const before = EP.durs.slice(0, EP.idx).reduce((a, b) => a + b, 0);
  const cur = Math.min(EP.segT, EP.durs[EP.idx] || 0);
  [...$('#segs').children].forEach((b, i) => {
    b.classList.toggle('now', i === EP.idx);
    b.querySelector('i').style.width = i < EP.idx ? '100%' : i === EP.idx ? `${(cur / (EP.durs[i] || 1)) * 100}%` : '0';
  });
  $('#tltime').textContent = `${mmss(before + cur)} / ${mmss(total)}`;
}
setInterval(() => {
  if (!EP || !EP.durs || CLOCK) return;
  if (!paused) EP.segT += 100 * SPEED;
  epDraw();
}, 100);

async function epStart() {
  const btn = $('#epbtn');
  btn.disabled = true;
  btn.textContent = '准备整集…';
  const session = (LIST[CUR] || LIST[0]).session;
  const show = await (await fetch(`/api/shows/${encodeURIComponent(session)}`)).json();
  if (!CAST.length) CAST = await (await fetch('/api/characters')).json();
  if (show.castOrder) CAST.sort((a, b) => show.castOrder.indexOf(a.id) - show.castOrder.indexOf(b.id));
  const order = show.episode || show.hands.map((_, k) => k + 1);
  EP = { session, title: show.title || session, narration: show.narration || {}, selfIntro: show.selfIntro || {}, logs: {}, idx: 0, segT: 0 };
  try { const r = await fetch(`/voice/show-${encodeURIComponent(session)}/manifest.json`); SHOWVOICE = r.ok ? await r.json() : {}; } catch (e) { SHOWVOICE = {}; }
  EP.hands = order.map(n => LIST.find(h => h.session === session && h.hand === n)).filter(Boolean);
  EP.items = [{ kind: 'intro', label: '片头' }, ...EP.hands.map((h, k) => ({ kind: 'hand', pos: k + 1, label: `第 ${k + 1} 手 ${h.title || ''}` })), { kind: 'outro', label: '片尾' }];
  document.body.classList.add('epmode');
  await epMeasure();
  epBuildTimeline();
  $('#tl').hidden = false;
  btn.disabled = false;
  btn.textContent = '退出整集';
  btn.onclick = () => location.reload();
  epGo(0);
}
$('#epbtn').addEventListener('click', () => { if (!EP) epStart(); });

// ---------- controls + fit ----------
const pauseBtn = $('#pause');
pauseBtn.addEventListener('click', () => {
  paused = !paused;
  stage.classList.toggle('paused', paused);
  pauseBtn.textContent = paused ? '继续' : '暂停';
  const ec = $('#endcard');
  if (paused) { vo.pause(); ec.pause(); AC.suspend(); }
  else {
    AC.resume();
    if (vo.src && !vo.ended) vo.play().catch(() => {});
    if (ec.currentTime > 0 && !ec.ended) ec.play().catch(() => {});
  }
});
function restart(k = 0) { paused = false; stage.classList.remove('paused'); pauseBtn.textContent = '暂停'; start(k); }
$('#replay').addEventListener('click', () => (EP ? epGo(EP.idx) : restart(0)));
$('#again').addEventListener('click', () => restart(0));
$('#mute').addEventListener('click', e => {
  muted = !muted;
  master.gain.value = muted ? 0 : 1;
  vo.muted = muted;
  e.currentTarget.textContent = muted ? '声音 关' : '声音 开';
});
$('#speed').addEventListener('click', e => { SPEED = SPEED === 1 ? 2 : 1; vo.playbackRate = SPEED * VOICE_RATE; e.currentTarget.textContent = SPEED + '× 速度'; });
$('#prev').addEventListener('click', () => { if (CUR > 0) selectHand(CUR - 1); });
$('#next').addEventListener('click', () => { if (CUR < LIST.length - 1) selectHand(CUR + 1); });
$('#handsel').addEventListener('change', e => selectHand(Number(e.target.value)));

function fit() {
  const avail = Math.min($('#box').clientWidth, Math.max(320, (window.innerHeight - 210) * 16 / 9));
  const vp = $('#vp');
  vp.style.width = avail + 'px';
  vp.style.height = (avail * 9 / 16) + 'px';
  stage.style.transform = `scale(${avail / 1600})`;
}
window.addEventListener('resize', fit);
fit();

paintTable();
document.fonts.ready.then(paintTable);
loadList();
</script>
