<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大模型德州回放</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;700;900&family=Oswald:wght@400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* Layout: a fixed 1600x900 stage scaled to the page width, replay controls underneath. One committed night look. */
:root {
  --ink: #05060B;
  --text: #F3F1EC;
  --muted: #9AA0B8;
  --gold: #E9C46A;
  --hot: #FF2E7E;
  --sil: #0B0D18;
  --display: 'ZCOOL QingKe HuangYou', 'Noto Sans SC', sans-serif;
  --brush: 'Ma Shan Zheng', 'ZCOOL QingKe HuangYou', serif;
  --body: 'Noto Sans SC', system-ui, sans-serif;
  --num: 'Oswald', 'Noto Sans SC', sans-serif;
  color-scheme: dark;
}
html, body { background: var(--ink); color: var(--text); }
body { font-family: var(--body); }
.wrap { max-width: 1600px; margin: 0 auto; padding-block: 18px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.top h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(22px, 3vw, 30px); color: var(--gold); text-wrap: balance; }
.top p { margin: 0; color: var(--muted); font-size: 13px; }
.box { width: 100%; }
.vp { position: relative; margin: 0 auto; overflow: hidden; border-radius: 10px; box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 30px 80px rgba(0,0,0,0.6); }
.stage { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; overflow: hidden; background: var(--ink); }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.controls button { font: 700 14px var(--body); color: var(--ink); background: var(--gold); border: 0; border-radius: 6px; padding: 10px 18px; min-height: 44px; cursor: pointer; }
.controls button.ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25); }
.controls button:focus-visible { outline: 3px solid var(--hot); outline-offset: 2px; }
.chaps { display: flex; flex-wrap: wrap; gap: 6px; }
.chaps button { font: 500 13px var(--body); color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 6px 12px; min-height: 36px; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); }
.chaps button.on { color: var(--ink); background: var(--text); box-shadow: none; }
.chaps button.now { background: var(--gold); }
.chaps button:focus-visible { outline: 3px solid var(--hot); outline-offset: 2px; }

/* the room */
#cam { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; transition: transform var(--camt, 1.4s) cubic-bezier(0.45, 0, 0.2, 1); }
#world { position: absolute; inset: 0; }
#city { position: absolute; left: -20px; top: -20px; width: 1640px; height: 380px; filter: blur(2.5px) brightness(0.62) saturate(0.85); }
#rain { position: absolute; left: 0; top: 0; width: 1600px; height: 344px; pointer-events: none; }
.mullion { position: absolute; top: 0; width: 10px; height: 352px; background: #04050A; box-shadow: 0 0 12px rgba(0,0,0,0.8); }
.wall { position: absolute; left: 0; top: 344px; width: 1600px; height: 556px; background: linear-gradient(#0B0A10 0%, #08070C 40%, #040306 100%); box-shadow: 0 -2px 0 rgba(255,255,255,0.05), 0 -30px 50px rgba(0,0,0,0.7); }
.spill { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 48% 60% at 52% -8%, rgba(255,232,190,0.13), transparent 70%); }
.tshadow { position: absolute; left: 150px; top: 330px; width: 1300px; height: 440px; border-radius: 50%; background: rgba(0,0,0,0.9); filter: blur(36px); }
#tablecv { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; }
.pool { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 34% 26% at 50% 45%, rgba(255,238,205,0.09), transparent 75%); }
.vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 80% 75% at 50% 46%, transparent 58%, rgba(0,0,0,0.72) 100%); z-index: 60; }

/* pot + hud */
#pot { position: absolute; left: 800px; top: 336px; transform: translate(-50%, -100%); display: flex; align-items: flex-end; gap: 12px; z-index: 25; }
#pot svg { display: block; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.55)); }
#pot .lbl { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; }
#pot small { font-size: 12px; letter-spacing: 3px; color: rgba(214,232,222,0.7); margin-bottom: 4px; }
#pot b { font: 500 32px var(--num); color: var(--gold); font-variant-numeric: tabular-nums; }
#hud { position: absolute; left: 34px; top: 26px; z-index: 70; display: flex; flex-direction: column; gap: 4px; }
#hud .h { font-family: var(--display); font-size: 26px; color: var(--text); }
#hud .sub { font-size: 13px; color: var(--muted); letter-spacing: 1px; }
#hud .sub b { color: var(--gold); font-weight: 700; }
#tick { position: absolute; left: 50%; top: 822px; transform: translate(-50%, 8px); max-width: 900px; z-index: 70; padding: 8px 18px; border-radius: 8px; background: rgba(5,6,11,0.85); box-shadow: inset 0 0 0 1px rgba(233,196,106,0.35); display: flex; gap: 12px; align-items: baseline; opacity: 0; transition: opacity 0.4s, transform 0.4s; white-space: nowrap; }
#tick.show { opacity: 1; transform: translate(-50%, 0); }
#tick span { font-family: var(--display); font-size: 16px; color: var(--gold); }
#tick p { margin: 0; font-size: 16px; }

/* seats */
.seat { position: absolute; width: 170px; height: 236px; transform: translate(-50%, -100%) scale(var(--sc)); transform-origin: 50% 100%; transition: opacity 0.5s; }
.bust { position: absolute; left: 0; top: 0; width: 170px; height: 187px; color: var(--sil); transition: transform 0.4s cubic-bezier(0.3, 1.4, 0.5, 1); }
.bust svg { width: 100%; height: 100%; filter: drop-shadow(0 0 1px var(--c)) drop-shadow(0 0 7px color-mix(in srgb, var(--c) 55%, transparent)); transition: filter 0.4s; }
.seat.on .bust { transform: translateY(-6px); }
.seat.on .bust svg { filter: drop-shadow(0 0 1.5px var(--c)) drop-shadow(0 0 14px var(--c)) drop-shadow(0 0 30px color-mix(in srgb, var(--c) 60%, transparent)); }
.seat.fold { opacity: 0.42; }
.seat.fold .bust svg, .seat.lose .bust svg { filter: grayscale(1) brightness(0.8) drop-shadow(0 0 1px #6B6F80); }
.plate { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 16px 6px; border-radius: 8px; background: rgba(6,7,13,0.86); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), inset 0 -2px 0 var(--c); white-space: nowrap; }
.plate b { font-family: var(--display); font-weight: 400; font-size: 20px; line-height: 1.1; }
.stk { font: 500 15px var(--num); color: var(--gold); font-variant-numeric: tabular-nums; }
.tag { position: absolute; left: 50%; top: 2px; transform: translate(-50%, -100%); padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; opacity: 0; transition: opacity 0.25s; }
.tag.show { opacity: 1; }
.tag.think { background: rgba(233,196,106,0.95); color: var(--ink); }
.tag.allin { background: var(--hot); color: var(--ink); }
.tag.quiet { background: rgba(255,255,255,0.14); color: #D8DBE6; }
.dbtn { position: absolute; width: 26px; height: 26px; transform: translate(-50%, -50%); border-radius: 50%; background: #FAF7F0; color: var(--ink); font: 700 14px var(--num); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #C9A24A, 0 4px 8px rgba(0,0,0,0.6); z-index: 21; }

/* cards */
.card { position: absolute; left: 0; top: 0; perspective: 700px; transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s; z-index: 20; }
.card.big { width: 68px; height: 96px; }
.card.sm { width: 44px; height: 62px; }
.card .in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1); }
.card.up .in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: 6px; backface-visibility: hidden; box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset, 0 6px 12px rgba(0,0,0,0.55); }
.back { background: repeating-linear-gradient(45deg, rgba(255,255,255,0.07) 0 1.5px, transparent 1.5px 7px), repeating-linear-gradient(-45deg, rgba(255,255,255,0.07) 0 1.5px, transparent 1.5px 7px), #1B2347; box-shadow: inset 0 0 0 3px #FAF7F0, inset 0 0 0 4px #C9A24A, 0 6px 12px rgba(0,0,0,0.55); }
.front { transform: rotateY(180deg); background: linear-gradient(160deg, #FFFDF8, #EEE9DE); color: #15151B; }
.front .ix { position: absolute; left: 5px; top: 4px; display: flex; flex-direction: column; align-items: center; font-family: var(--num); line-height: 0.95; }
.front .pip { position: absolute; right: 6px; bottom: 3px; line-height: 1; }
.big .ix b { font-size: 21px; font-weight: 700; } .big .ix i { font-style: normal; font-size: 16px; } .big .pip { font-size: 38px; }
.sm .ix b { font-size: 15px; font-weight: 700; } .sm .ix i { font-style: normal; font-size: 12px; } .sm .pip { font-size: 24px; }
.card.red .front { color: #C8223B; }
.card.dim { opacity: 0.45; }
.card.hl .face.front { box-shadow: 0 0 0 2px var(--gold), 0 0 22px rgba(233,196,106,0.65); }

/* chips */
.bet { position: absolute; transform: translate(-50%, -88%); display: flex; flex-direction: column; align-items: center; gap: 2px; z-index: 22; transition: left 0.55s cubic-bezier(0.5, 0, 0.4, 1), top 0.55s cubic-bezier(0.5, 0, 0.4, 1), opacity 0.4s; }
.bet svg { display: block; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.55)); }
.bet span { font: 500 13px var(--num); color: #F0E6CC; background: rgba(5,6,11,0.72); padding: 0 7px; border-radius: 3px; font-variant-numeric: tabular-nums; }
.bet.gone { opacity: 0; }

/* table talk */
.pop { position: absolute; transform: translate(-50%, -100%) translateY(6px); opacity: 0; background: rgba(9,10,20,0.94); color: var(--text); font-weight: 700; font-size: 17px; padding: 7px 14px; border-radius: 10px; white-space: nowrap; transition: transform 0.3s cubic-bezier(0.3, 1.4, 0.5, 1), opacity 0.25s; z-index: 900; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1), 0 8px 18px rgba(0,0,0,0.5); }
.pop i { font-style: normal; font-size: 12px; margin-right: 8px; }
.pop.in { opacity: 1; transform: translate(-50%, -100%); }
.pop.below { transform: translate(-50%, 0) translateY(-6px); }
.pop.below.in { transform: translate(-50%, 0); }

/* showdown */
.stamp { position: absolute; transform: translate(-50%, -50%) rotate(-8deg) scale(2); opacity: 0; font-family: var(--display); font-size: 32px; padding: 2px 14px; border: 3px solid #C3C8D8; color: #C3C8D8; border-radius: 6px; background: rgba(5,6,11,0.82); transition: transform 0.3s cubic-bezier(0.3, 1.5, 0.5, 1), opacity 0.2s; z-index: 900; white-space: nowrap; }
.stamp.win { border-color: var(--gold); color: var(--gold); }
.stamp.huge { font-size: 58px; border-width: 4px; color: var(--text); border-color: var(--text); }
.stamp.in { opacity: 1; transform: translate(-50%, -50%) rotate(-8deg) scale(1); }
#win { position: absolute; left: 50%; top: 116px; transform: translateX(-50%) scale(0.7); opacity: 0; transition: transform 0.45s cubic-bezier(0.3, 1.4, 0.5, 1), opacity 0.3s; z-index: 75; text-align: center; padding: 14px 56px 18px; background: rgba(5,6,11,0.9); box-shadow: inset 0 1px 0 rgba(233,196,106,0.6), inset 0 -1px 0 rgba(233,196,106,0.6); }
#win.show { transform: translateX(-50%) scale(1); opacity: 1; }
#win small { display: block; font: 500 15px var(--num); letter-spacing: 10px; color: var(--gold); }
#win strong { display: block; font-family: var(--display); font-weight: 400; font-size: 46px; line-height: 1.25; }
#win b { display: block; font: 500 56px var(--num); color: var(--gold); line-height: 1; font-variant-numeric: tabular-nums; }

/* dialogue */
#dlg { position: absolute; left: 40px; right: 40px; bottom: 28px; height: 206px; transform: translateY(150%); transition: transform 0.5s cubic-bezier(0.2, 0.9, 0.2, 1); z-index: 80; }
#dlg.show { transform: translateY(0); }
#dlg .boxbg { position: absolute; inset: 0; background: rgba(7,8,16,0.95); box-shadow: inset 0 0 0 1.5px var(--c), 0 0 40px rgba(0,0,0,0.6); clip-path: polygon(0 0, 100% 0, 100% 100%, 3% 100%, 0 84%); }
#dlg .port { position: absolute; left: 14px; bottom: 0; width: 290px; height: 344px; overflow: hidden; clip-path: polygon(0 7%, 100% 0, 100% 100%, 0 100%); background: repeating-linear-gradient(135deg, rgba(5,6,11,0.16) 0 6px, transparent 6px 14px), var(--c); }
#dlg .port svg { position: absolute; left: -10px; bottom: -6px; width: 310px; height: 340px; color: var(--ink); }
#dlg .name { position: absolute; left: 304px; top: -22px; transform: skewX(-14deg); background: var(--c); padding: 4px 22px; display: flex; gap: 12px; align-items: baseline; }
#dlg .name > * { transform: skewX(14deg); color: var(--ink); }
#dlg .name span { font-family: var(--display); font-size: 28px; }
#dlg .name small { font: 700 14px var(--num); letter-spacing: 2px; }
#dlg .say { position: absolute; left: 340px; top: 38px; width: 720px; font-size: 32px; font-weight: 900; line-height: 1.38; }
#dlg .say::after { content: "▌"; color: var(--c); animation: blink 0.7s infinite; }
#dlg .meta { position: absolute; left: 340px; bottom: 16px; display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 13px; }
#dlg .wave { display: flex; gap: 3px; align-items: center; height: 24px; }
#dlg .wave i { width: 4px; background: var(--c); animation: wave 0.6s infinite alternate; }
#dlg .wave i:nth-child(2) { animation-delay: 0.1s; } #dlg .wave i:nth-child(3) { animation-delay: 0.25s; } #dlg .wave i:nth-child(4) { animation-delay: 0.05s; } #dlg .wave i:nth-child(5) { animation-delay: 0.3s; }
#dlg .inner { position: absolute; right: 20px; top: 20px; bottom: 20px; width: 420px; box-sizing: border-box; padding: 14px 18px; border-radius: 8px; border: 1.5px dashed rgba(255,255,255,0.3); background: rgba(255,255,255,0.03); opacity: 0; transform: translateX(24px); transition: opacity 0.35s, transform 0.35s; }
#dlg .inner.show { opacity: 1; transform: none; }
#dlg .inner h4 { margin: 0 0 6px; font-family: var(--display); font-weight: 400; font-size: 17px; color: #CDD1DF; }
#dlg .inner p { margin: 0; font-size: 17px; line-height: 1.6; color: #E4E7F0; }

/* all-in cut-in */
#cut { position: absolute; inset: 0; z-index: 90; pointer-events: none; opacity: 0; }
#cut.go { opacity: 1; }
#cut.out { opacity: 0; transition: opacity 0.3s; }
#cut .dim { position: absolute; inset: 0; background: rgba(4,4,10,0.72); }
#cut .band { position: absolute; left: -300px; top: 300px; width: 2200px; height: 320px; background: repeating-linear-gradient(90deg, rgba(5,6,11,0.12) 0 4px, transparent 4px 40px), var(--hot); box-shadow: 0 -6px 0 var(--gold), 0 6px 0 var(--gold); transform: rotate(-9deg) translateX(-120%); }
#cut.go .band { animation: bandIn 0.32s cubic-bezier(0.2, 0.9, 0.2, 1) forwards, lines 0.4s linear infinite; }
#cut .who { position: absolute; left: 70px; top: 40px; width: 540px; height: 820px; clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%); background: #07080F; box-shadow: inset 0 0 0 5px var(--hot); transform: translateX(-120%); }
#cut .who svg { position: absolute; left: 10px; bottom: 0; width: 520px; height: 572px; color: var(--sil); filter: drop-shadow(0 0 3px var(--hot)) drop-shadow(0 0 24px var(--hot)); }
#cut.go .who { animation: whoIn 0.38s 0.08s cubic-bezier(0.2, 0.9, 0.2, 1) forwards; }
#cut .shout { position: absolute; left: 640px; top: 110px; font-family: var(--brush); font-size: 250px; line-height: 1; color: var(--gold); text-shadow: 7px 7px 0 #05060B; transform: rotate(-9deg) scale(3); opacity: 0; }
#cut.go .shout { animation: slam 0.3s 0.25s cubic-bezier(0.2, 1.4, 0.4, 1) forwards; }
#cut .sub { position: absolute; left: 720px; top: 430px; display: flex; gap: 28px; align-items: baseline; transform: rotate(-9deg); opacity: 0; }
#cut .sub b { font: italic 700 116px var(--num); color: #05060B; letter-spacing: 6px; }
#cut .sub span { font: 700 70px var(--num); color: var(--text); }
#cut.go .sub { animation: fadeUp 0.3s 0.45s forwards; }
#cut .flash { position: absolute; inset: 0; background: #FFF; opacity: 0; }
#cut.go .flash { animation: flash 0.45s ease-out; }
#world.shake { animation: shake 0.45s; }

/* intro + end */
.overlay { position: absolute; inset: 0; z-index: 95; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(5,6,11,0.8); opacity: 0; pointer-events: none; transition: opacity 0.8s; text-align: center; }
.overlay.show { opacity: 1; pointer-events: auto; }
#intro .t1 { font-family: var(--brush); font-size: 128px; line-height: 1; color: var(--gold); text-shadow: 5px 5px 0 #000; }
#intro .t2 { font-family: var(--display); font-size: 28px; letter-spacing: 6px; }
#end .t2 { font-family: var(--display); font-size: 38px; }
#end .t3 { font-size: 16px; color: var(--muted); }
#end button { font: 700 18px var(--body); color: var(--ink); background: var(--gold); border: 0; border-radius: 6px; padding: 12px 26px; min-height: 48px; cursor: pointer; }
#end button:focus-visible { outline: 3px solid var(--hot); outline-offset: 2px; }

.stage.paused *, .stage.paused *::after { animation-play-state: paused !important; }
.stage.ff *, .stage.ff *::after { transition: none !important; animation: none !important; }

@keyframes blink { 50% { opacity: 0.2; } }
@keyframes wave { from { height: 5px; } to { height: 24px; } }
@keyframes bandIn { to { transform: rotate(-9deg) translateX(0); } }
@keyframes lines { to { background-position: 40px 0, 0 0; } }
@keyframes whoIn { to { transform: translateX(0); } }
@keyframes slam { to { opacity: 1; transform: rotate(-9deg) scale(1); } }
@keyframes fadeUp { from { opacity: 0; transform: rotate(-9deg) translateY(30px); } to { opacity: 1; transform: rotate(-9deg) translateY(0); } }
@keyframes flash { from { opacity: 0.85; } to { opacity: 0; } }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translate(-12px, 7px); } 40% { transform: translate(10px, -8px); } 60% { transform: translate(-7px, 5px); } 80% { transform: translate(5px, -3px); } }

@media (prefers-reduced-motion: reduce) {
  #world.shake, #cut.go .flash { animation: none; }
  #cut.go .band, #cut.go .shout, #cut.go .sub { animation: none; transform: rotate(-9deg); opacity: 1; }
  #cut.go .who { animation: none; transform: none; }
  #dlg .wave i, #dlg .say::after { animation: none; }
}

/* replay page additions */
body { margin: 0; }
.picker { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.picker select { font: 500 14px var(--body); color: var(--text); background: #0E1020; border: 0; border-radius: 6px; padding: 10px 12px; min-height: 44px; max-width: min(420px, 100%); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2); }
.picker select:focus-visible { outline: 3px solid var(--hot); outline-offset: 2px; }
.picker label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); min-height: 44px; cursor: pointer; }
.picker input { width: 18px; height: 18px; accent-color: var(--gold); }
.src { font-size: 12px; color: var(--muted); }
#dlg.quick { transition-duration: 0.32s; }
#dlg.quick .inner { display: none; }
#dlg.quick .say { width: 1100px; font-size: 30px; top: 44px; }
</style>

<div class="wrap">
  <div class="top">
    <h1 id="title">回放</h1>
    <p id="subtitle">读取中…</p>
  </div>
  <div class="box" id="box">
    <div class="vp" id="vp">
      <div class="stage" id="stage">
        <div id="cam"><div id="world">
          <canvas id="city" width="1640" height="380"></canvas>
          <canvas id="rain" width="1600" height="344"></canvas>
          <div class="mullion" style="left: 395px"></div>
          <div class="mullion" style="left: 795px"></div>
          <div class="mullion" style="left: 1195px"></div>
          <div class="wall"></div>
          <div class="spill"></div>
          <div class="tshadow"></div>
          <canvas id="tablecv"></canvas>
          <div class="pool"></div>
          <div id="pot"><div id="potchips"></div><div class="lbl"><small>底池</small><b id="potn">0</b></div></div>
          <div id="seats"></div>
          <div id="dyn"></div>
        </div></div>
        <div class="vig"></div>
        <div id="hud"><div class="h" id="hudh">第 1 手</div><div class="sub"><b id="st">发牌</b> · <span id="blinds"></span></div></div>
        <div id="tick"><span>解说 · 老K</span><p id="tickp"></p></div>
        <div id="win"><small>WINNER</small><strong id="winn"></strong><b id="wina"></b></div>
        <div id="dlg">
          <div class="boxbg"></div>
          <div class="port" id="dport"></div>

// ---------- casino chips: denominations stacked in columns ----------
const DENOMS = [[1000, '#D4A11E'], [500, '#6A38A6'], [100, '#24252F'], [25, '#1C7C4C'], [5, '#B3233A']];
function chipsSVG(amount, maxCols = 3) {
  let rest = amount;
  const cols = [];
  for (const [v, c] of DENOMS) { const n = Math.floor(rest / v); if (n > 0) { cols.push({ n: Math.min(n, 12), c }); rest -= n * v; } }
  const use = cols.slice(0, maxCols);
  if (!use.length) return '';
  const cw = 30, th = 4, h = Math.max(...use.map(c => c.n)) * th + 15, w = use.length * cw + 2;
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">`;
  use.forEach((col, ci) => {
    const x = ci * cw + 16;
    for (let k = 0; k < col.n; k++) {
      const y = h - 7 - k * th;
      s += `<ellipse cx="${x}" cy="${y}" rx="14" ry="6" fill="${shade(col.c, -0.45)}"/><rect x="${x - 14}" y="${y - th}" width="28" height="${th}" fill="${shade(col.c, -0.2)}"/>`
        + `<rect x="${x - 10.5}" y="${y - th}" width="3" height="${th}" fill="#EDE6D6"/><rect x="${x - 1.5}" y="${y - th}" width="3" height="${th}" fill="#EDE6D6"/><rect x="${x + 7.5}" y="${y - th}" width="3" height="${th}" fill="#EDE6D6"/>`;
    }
    const ty = h - 7 - col.n * th;
    s += `<ellipse cx="${x}" cy="${ty}" rx="14" ry="6" fill="${col.c}"/><ellipse cx="${x}" cy="${ty}" rx="11.6" ry="4.9" fill="none" stroke="#EDE6D6" stroke-width="2.2" stroke-dasharray="3 4.3"/>`
      + `<ellipse cx="${x}" cy="${ty}" rx="7.6" ry="3.2" fill="${shade(col.c, 0.15)}" stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/><ellipse cx="${x - 3}" cy="${ty - 1.6}" rx="5" ry="1.2" fill="rgba(255,255,255,0.18)"/>`;
  });
  return s + '</svg>';
}

// ---------- the table, painted once ----------
function paintTable() {
  const cv = $('#tablecv'), S = 2;
  cv.width = 1600 * S; cv.height = 900 * S;
  const x = cv.getContext('2d');
  x.scale(S, S);
  const CX = 800, CY = 430, R = 640, K = 0.375, FELT = R - 62;
  const inPlane = (fn, dy = 0) => { x.save(); x.translate(CX, CY + dy); x.scale(1, K); fn(); x.restore(); };
  const ring = (r, w, style, dash) => inPlane(() => { x.beginPath(); x.arc(0, 0, r, 0, Math.PI * 2); x.lineWidth = w; x.strokeStyle = style; x.setLineDash(dash || []); x.stroke(); });
  const disc = (r, style, dy = 0) => inPlane(() => { x.beginPath(); x.arc(0, 0, r, 0, Math.PI * 2); x.fillStyle = style; x.fill(); }, dy);
  // fill the cloth area with something drawn in screen space (gradients, textures)
  const onCloth = paint => inPlane(() => { x.beginPath(); x.arc(0, 0, FELT, 0, Math.PI * 2); x.clip(); x.scale(1, 1 / K); x.translate(-CX, -CY); paint(); });

  // apron: the table's thickness, lit from above so it falls off toward the sides
  const ap = x.createLinearGradient(CX - R, 0, CX + R, 0);
  ap.addColorStop(0, '#07050A'); ap.addColorStop(0.5, '#22151A'); ap.addColorStop(1, '#07050A');
  disc(R, ap, 30);
  // padded leather rail: concentric strokes give it a rounded, tubular profile
  disc(R, '#120B0D');
  for (let k = 0; k <= 22; k++) {
    const t = k / 22;
    ring(R - 24, 48 * (1 - t * 0.94), mix('#120A0C', '#5B2A33', Math.pow(t, 1.7)));
  }
  inPlane(() => {
    x.beginPath(); x.arc(0, 0, R - 30, Math.PI * 1.08, Math.PI * 1.92);
    x.lineWidth = 5; x.strokeStyle = 'rgba(255,232,214,0.16)'; x.shadowColor = 'rgba(255,232,214,0.4)'; x.shadowBlur = 10; x.stroke();
  });
  ring(R - 8, 1.1, 'rgba(201,162,74,0.35)', [5, 5]);
  // wood cap and brass inlay between rail and cloth
  const wood = x.createLinearGradient(0, CY - R * K, 0, CY + R * K);
  wood.addColorStop(0, '#80592F'); wood.addColorStop(0.5, '#5A3B1F'); wood.addColorStop(1, '#2E1D0F');
  ring(R - 54, 14, wood);
  ring(FELT + 1, 1.6, '#C9A24A');
  // the cloth, lit by a light just off-screen above
  onCloth(() => {
    const felt = x.createRadialGradient(CX, CY - 40, 20, CX, CY + 10, R * 0.95);
    felt.addColorStop(0, '#22917F'); felt.addColorStop(0.42, '#136556'); felt.addColorStop(0.78, '#0A3D36'); felt.addColorStop(1, '#052320');
    x.fillStyle = felt; x.fillRect(0, 0, 1600, 900);
  });
  // cloth grain
  const n = document.createElement('canvas'); n.width = n.height = 128;
  const nx = n.getContext('2d'), img = nx.createImageData(128, 128);
  for (let k = 0; k < img.data.length; k += 4) { const v = Math.random() * 255; img.data[k] = img.data[k + 1] = img.data[k + 2] = v; img.data[k + 3] = 20; }
  nx.putImageData(img, 0, 0);
  onCloth(() => { x.fillStyle = x.createPattern(n, 'repeat'); x.fillRect(0, 0, 1600, 900); });
  // the cloth darkens where it meets the rail
  inPlane(() => {
    const g = x.createRadialGradient(0, 0, FELT * 0.78, 0, 0, FELT);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)');
    x.beginPath(); x.arc(0, 0, FELT, 0, Math.PI * 2); x.fillStyle = g; x.fill();
  });
  // betting line and the print, both in worn gold
  ring(R - 170, 1.4, 'rgba(214,180,100,0.32)');
  x.save(); x.translate(CX, CY + 128); x.scale(1, 0.62);
  x.textAlign = 'center'; x.fillStyle = 'rgba(214,180,100,0.2)';
  x.font = "500 30px Oswald, sans-serif";
  if ('letterSpacing' in x) x.letterSpacing = '14px';
  x.fillText("LLM HOLD'EM", 0, 0);
  x.font = "400 15px 'Noto Sans SC', sans-serif";
  if ('letterSpacing' in x) x.letterSpacing = '8px';
  x.fillText('大模型终极德州之战 · 第二季', 0, 30);
  x.restore();
}

// ---------- night city behind glass ----------
function paintCity() {
  const x = $('#city').getContext('2d');
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const sky = x.createLinearGradient(0, 0, 0, 380);
  sky.addColorStop(0, '#04060F'); sky.addColorStop(0.7, '#141030'); sky.addColorStop(1, '#2C1430');
  x.fillStyle = sky; x.fillRect(0, 0, 1640, 380);
  for (const L of [{ col: '#0D0D22', min: 120, max: 270, w0: 26, w1: 60, win: 0.1, wc: '150,175,255' }, { col: '#07071A', min: 70, max: 200, w0: 40, w1: 120, win: 0.22, wc: '255,205,130' }]) {
    let bx = 0;
    while (bx < 1640) {
      const w = lerp(L.w0, L.w1, rnd()), h = lerp(L.min, L.max, rnd());
      x.fillStyle = L.col; x.fillRect(bx, 380 - h, w, h);
      for (let wy = 380 - h + 8; wy < 374; wy += 9)
        for (let wx = bx + 5; wx < bx + w - 6; wx += 8)
          if (rnd() < L.win) { x.fillStyle = `rgba(${L.wc},${0.25 + rnd() * 0.6})`; x.fillRect(wx, wy, 3, 4); }
      bx += w + lerp(2, 10, rnd());
    }
  }
}
const rainCtx = $('#rain').getContext('2d');
const RAIN = Array.from({ length: 90 }, () => ({ x: Math.random() * 1700, y: Math.random() * 344, l: 8 + Math.random() * 12, v: 5 + Math.random() * 5 }));
function rain() {
  rainCtx.clearRect(0, 0, 1600, 344);
  rainCtx.strokeStyle = 'rgba(190,205,255,0.12)'; rainCtx.lineWidth = 1;
  rainCtx.beginPath();
  for (const d of RAIN) {
    if (!paused) { d.y += d.v; d.x -= d.v * 0.2; if (d.y > 344) { d.y = -20; d.x = Math.random() * 1700; } }
    rainCtx.moveTo(d.x, d.y); rainCtx.lineTo(d.x - d.l * 0.2, d.y + d.l);
  }
  rainCtx.stroke();
  requestAnimationFrame(rain);
}

// ---------- director: turn a recorded hand into a shot list ----------
const RANK_CN = { 'Royal Flush': '皇家同花顺', 'Straight Flush': '同花顺', 'Four of a Kind': '四条', 'Full House': '葫芦', 'Flush': '同花', 'Straight': '顺子', 'Three of a Kind': '三条', 'Two Pair': '两对', 'Pair': '一对', 'High Card': '高牌' };
const STREET_CN = { preflop: '翻牌前', flop: '翻牌', turn: '转牌', river: '河牌' };
const SUIT = { h: '♥', d: '♦', c: '♣', s: '♠', '♥': '♥', '♦': '♦', '♣': '♣', '♠': '♠' };

// 规则：全下放大招特写；全下之后、河牌上的下注/跟注、大额加注，用带心声的完整对话框并推镜头；
// 其余有台词的动作只在底部快速闪过台词
function direct(log) {
  const idx = Object.fromEntries(log.players.map((p, i) => [p.id, i]));
  const bb = log.blinds[1];
  const out = [], chaps = [];
  const chap = name => { chaps.push(name); out.push({ t: 'chap', i: chaps.length - 1 }); };
  const seat = s => (s ? { p: idx[s.p], amount: s.amount } : null);
  chap('发牌');
  out.push({ t: 'deal' });
  const blinds = log.events.find(e => e.t === 'blinds');
  out.push({ t: 'blinds', sb: seat(blinds && blinds.sb), bb: seat(blinds && blinds.bb) });
  chap('翻牌前');
  let pressure = false;
  for (const e of log.events) {
    if (e.t === 'act') {
      if (e.allIn && !pressure) chap('全下');
      const big = e.allIn || (e.a === 'raise' && e.to >= 8 * bb);
      const full = !!e.in && (big || pressure || (e.street === 'river' && ['bet', 'raise', 'call'].includes(e.a)));
      out.push({ t: 'act', p: idx[e.p], a: e.a, to: e.to || 0, allIn: !!e.allIn, sp: e.sp || '', in: e.in || '', full, cut: !!e.allIn && e.a !== 'call', street: e.street });
      if (e.allIn) pressure = true;
    } else if (e.t === 'board') {
      out.push({ t: 'collect' });
      chap(STREET_CN[e.street]);
      out.push({ t: 'board', cards: e.cards, river: e.street === 'river', street: e.street });
    } else if (e.t === 'result') {
      out.push({ t: 'collect' });
      chap('结算');
      out.push({ t: 'show' });
      out.push({ t: 'end' });
    }
  }
  return { shots: out, chaps };
}

// ---------- replay engine ----------
const CX = 800, CY = 430;
let LOG = null, SHOTS = [], CHAPS = [], LIST = [], CUR = -1, FIRST = true;
let G = [], pot = 0, boardEls = [], boardN = 0;
let run = 0, paused = false, FF = false, SPEED = 1;
const STOP = Symbol('stop');

function sleep(ms) {
  return new Promise(res => {
    let t = 0;
    const id = setInterval(() => { if (!paused) t += 20 * SPEED; if (t >= ms) { clearInterval(id); res(); } }, 20);
  });
}
async function W(ms) { const id = run; if (!FF) await sleep(ms); if (id !== run) throw STOP; }

const camEl = $('#cam');
function cam(x, y, z = 1, ms = 1400) {
  z = Math.max(1, z);
  const cx = Math.min(1600 - 800 / z, Math.max(800 / z, x));
  const cy = Math.min(900 - 450 / z, Math.max(450 / z, y));
  camEl.style.setProperty('--camt', (FF || REDUCED ? 0 : ms) + 'ms');
  camEl.style.transform = `translate(${800 - cx * z}px, ${450 - cy * z}px) scale(${z})`;
}
const camHome = (ms = 1400) => cam(800, 450, 1, ms);
// 把说话的人放在画面上半部分，避开底部对话框和立绘
function camOn(i, z = 1.3, ms = 1300) { const g = G[i]; cam(g.x - 100 / z, g.ay - 190 * g.sc + 210 / z, z, ms); }

const chapsEl = $('#chaps');
function buildChaps() {
  chapsEl.innerHTML = '';
  CHAPS.forEach((t, k) => { const b = el('button', '', t); b.type = 'button'; b.addEventListener('click', () => restart(k)); chapsEl.append(b); });
}
function chap(k) { [...chapsEl.children].forEach((c, j) => { c.classList.toggle('on', j <= k); c.classList.toggle('now', j === k); }); }
function street(name) { $('#st').textContent = name; }
let tickTimer;
function tick(t) {
  if (FF) return;
  const box = $('#tick');
  $('#tickp').textContent = t; box.classList.add('show');
  clearTimeout(tickTimer); tickTimer = setTimeout(() => box.classList.remove('show'), 4200 / SPEED);
}
function countTo(node, from, to, ms) {
  if (FF) { node.textContent = fmt(to); return; }
  const t0 = performance.now();
  const f = t => { const k = Math.min(1, (t - t0) / ms); node.textContent = fmt(Math.round(from + (to - from) * k)); if (k < 1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}
function setPot(v) { countTo($('#potn'), pot, v, 450); pot = v; $('#potchips').innerHTML = chipsSVG(v, 4); }

function reset() {
  dyn.innerHTML = ''; seatsEl.innerHTML = '';
  pot = 0; boardEls = []; boardN = 0;
  $('#potn').textContent = '0'; $('#potchips').innerHTML = '';
  ['#win', '#dlg', '#end', '#tick'].forEach(s => $(s).classList.remove('show'));
  $('#cut').classList.remove('go', 'out');
  world.classList.remove('shake');
  street('发牌'); chap(-1);
  $('#hudh').textContent = `第 ${LOG.hand} 手`;
  $('#blinds').textContent = `盲注 ${fmt(LOG.blinds[0])} / ${fmt(LOG.blinds[1])}`;
  const n = LOG.players.length;
  G = LOG.players.map((d, i) => {
    const r = (360 * i / n - 180 / n) * Math.PI / 180;
    const x = CX + 640 * Math.sin(r), y = CY - 255 * Math.cos(r);
    const near = y > 600, far = y < 250;
    const c = d.color || '#C3C8D8';
    const g = { ...d, c, k: d.look, i, x, y, near, far, sc: 0.84 + (y - 175) / 510 * 0.3, ay: y + (near ? 78 : 22), bet: 0, betEl: null, cardEls: [] };
    const ht = near ? 0.4 : 0.31, bt = near ? 0.6 : 0.52;
    g.hx = lerp(x, CX, ht); g.hy = lerp(y, CY, ht); g.bx = lerp(x, CX, bt); g.by = lerp(y, CY, bt);
    const e = el('div', 'seat', `<div class="bust">${sil(d.look, c)}</div><div class="plate"><b>${esc(d.name)}</b><span class="stk">${fmt(d.stack)}</span></div><div class="tag"></div>`);
    e.style.left = x + 'px'; e.style.top = g.ay + 'px'; e.style.zIndex = Math.round(y);
    e.style.setProperty('--c', c); e.style.setProperty('--sc', g.sc);
    seatsEl.append(e); g.el = e;
    return g;
  });
}

function on(i, b) { G[i].el.classList.toggle('on', b); }
function tag(i, type, text, ms) {
  const t = G[i].el.querySelector('.tag');
  t.className = 'tag show ' + type; t.textContent = text;
  if (ms) setTimeout(() => { if (t.textContent === text) t.className = 'tag'; }, ms / SPEED);
}
function untag(i) { G[i].el.querySelector('.tag').className = 'tag'; }
function setStack(g, v) { g.stack = v; g.el.querySelector('.stk').textContent = fmt(v); }

function cardEl(code, size) {
  const r = code[0] === 'T' ? '10' : code[0], s = SUIT[code[1]] || code[1], red = s === '♥' || s === '♦';
  return el('div', `card ${size}${red ? ' red' : ''}`, `<div class="in"><div class="face back"></div><div class="face front"><div class="ix"><b>${r}</b><i>${s}</i></div><div class="pip">${s}</div></div></div>`);
}
function place(e, x, y, rot = 0) { e.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`; }

async function deal() {
  const n = G.length, btn = Math.max(0, LOG.players.findIndex(p => p.id === LOG.button));
  const order = Array.from({ length: n }, (_, k) => (btn + 1 + k) % n);
  for (let round = 0; round < 2; round++) {
    for (const i of order) {
      const g = G[i];
      if (!g.cards || !g.cards[round]) continue;
      const c = cardEl(g.cards[round], 'sm');
      place(c, CX - 22, CY - 31); dyn.append(c); c.getBoundingClientRect();
      place(c, g.hx - 22 + (round ? 13 : -13), g.hy - 31, round ? 6 : -6);
      g.cardEls.push(c);
      await W(60);
    }
  }
  await W(400);
  for (const i of order) { G[i].cardEls.forEach(c => c.classList.add('up')); await W(50); }
  const k = G[btn], d = el('div', 'dbtn', 'D');
  d.style.left = k.hx + 'px'; d.style.top = (k.hy - 56) + 'px';
  dyn.append(d);
}

async function board(ev) {
  street(STREET_CN[ev.street]);
  if (ev.river) cam(800, 415, 1.12, 1600);
  for (const code of ev.cards) {
    const k = boardN++;
    const c = cardEl(code, 'big');
    place(c, CX - 34, CY - 48); dyn.append(c); c.getBoundingClientRect();
    place(c, 602 + k * 82, 372);
    boardEls[k] = c;
    await W(300);
    c.classList.add('up');
    await W(ev.river ? 700 : 220);
  }
  if (ev.river) { await W(500); camHome(1600); }
}

function setBet(i, total) {
  const g = G[i];
  setStack(g, g.stack - (total - g.bet)); g.bet = total;
  if (!g.betEl) {
    g.betEl = el('div', 'bet', '<div class="cv"></div><span></span>');
    g.betEl.style.left = g.bx + 'px'; g.betEl.style.top = g.by + 'px';
    dyn.append(g.betEl);
  }
  g.betEl.querySelector('.cv').innerHTML = chipsSVG(total);
  g.betEl.querySelector('span').textContent = fmt(total);
}

async function collect() {
  let add = 0;
  G.forEach(g => {
    if (!g.betEl) return;
    add += g.bet;
    const b = g.betEl;
    b.style.left = CX + 'px'; b.style.top = '330px'; b.classList.add('gone');
    setTimeout(() => b.remove(), FF ? 0 : 600);
    g.betEl = null; g.bet = 0;
  });
  if (!add) return;
  await W(560);
  setPot(pot + add);
  await W(350);
}

function apply(i, ev) {
  if (ev.a === 'fold') { G[i].el.classList.add('fold'); G[i].cardEls.forEach(c => c.classList.add('dim')); tag(i, 'quiet', '弃牌'); }
  else if (ev.a === 'check') tag(i, 'quiet', '过牌', 1100);
  else {
    setBet(i, ev.to);
    if (ev.allIn) tag(i, 'allin', 'ALL IN');
    else tag(i, 'quiet', { call: '跟注', bet: '下注', raise: '加注' }[ev.a] || ev.a, 1100);
  }
}

async function type(node, txt, ms) { if (FF) { node.textContent = txt; return; } for (const ch of txt) { node.textContent += ch; await W(ms); } }

// 底部对话框：full带心声并推镜头；否则只快速闪过一句台词
async function say(i, speech, inner, full) {
  if (FF) return;
  const g = G[i], dlg = $('#dlg');
  on(i, true);
  if (full) camOn(i);
  dlg.classList.toggle('quick', !full);

  $('#dsay').textContent = ''; $('#dinnerp').textContent = '';
  $('#dinner').classList.remove('show');
  dlg.classList.add('show');
  await W(full ? 450 : 300);
  await type($('#dsay'), speech || '……', full ? 34 : 26);
  if (full && inner) {
    await W(450);
    $('#dinner').classList.add('show');
    await W(250);
    await type($('#dinnerp'), inner, 26);
    await W(1800);
  } else {
    await W(900);
  }

async function allinCut(i, amt) {
  if (FF) return;
  const g = G[i], cut = $('#cut');
  $('#cutwho').innerHTML = sil(g.k, g.c);
  $('#cutamt').textContent = fmt(amt);
  cam(g.x, g.y - 60, 1.5, 300);
  await W(380);
  cut.classList.remove('go', 'out'); void cut.offsetWidth; cut.classList.add('go');
  await W(260);
  if (!REDUCED) { world.classList.remove('shake'); void world.offsetWidth; world.classList.add('shake'); }
  await W(1900);
  camOn(i, 1.3, 0);
  cut.classList.add('out');
  await W(350);
  cut.classList.remove('go', 'out');
}

async function act(ev) {
  const i = ev.p;
  on(i, true); tag(i, 'think', '思考中');
  await W(ev.full ? 800 : 500);
  untag(i);
  if (ev.cut) {
    apply(i, ev);
    tick(`${G[i].name} 全下 ${fmt(ev.to)}！`);
    await allinCut(i, ev.to);
    if (ev.sp || ev.in) await say(i, ev.sp, ev.in, true);
  } else if (ev.full) {
    on(i, false);
    await say(i, ev.sp, ev.in, true);
    apply(i, ev);
    await W(500);
  } else {
    apply(i, ev);
    if (ev.sp) await say(i, ev.sp, '', false);
    else await W(450);
  }
  on(i, false);
}

function stamp(x, y, text, cls) {
  if (FF) return;
  const s = el('div', 'stamp ' + (cls || ''), text);
  s.style.left = x + 'px'; s.style.top = y + 'px';
  dyn.append(s);
  requestAnimationFrame(() => s.classList.add('in'));
}

async function show() {
  const r = LOG.result;
  street('结算');
  if (!r) return;
  const byId = Object.fromEntries(G.map(g => [g.id, g]));
  const winIds = (r.winners || []).map(w => w.playerId);
  const shown = Object.keys(r.ranks || {});
  if (r.isShowdown && shown.length) {
    cam(800, 410, 1.1, 1500);
    shown.forEach(id => byId[id] && byId[id].cardEls.forEach(c => c.classList.add('hl')));
    await W(900);
    for (const id of [...shown.filter(id => !winIds.includes(id)), ...shown.filter(id => winIds.includes(id))]) {
      const g = byId[id]; if (!g) continue;
      stamp(g.hx, g.hy - 60, RANK_CN[r.ranks[id]] || r.ranks[id], winIds.includes(id) ? 'win' : '');
      await W(650);
    }
  }
  const total = (r.winners || []).reduce((s, w) => s + w.amount, 0);
  const names = winIds.map(id => byId[id] ? byId[id].name : id);
  $('#winn').textContent = names.length > 1 ? `${names.join('、')} 平分` : `${names[0] || ''} 赢下`;
  $('#wina').textContent = '+' + fmt(total);
  if (!FF) $('#win').classList.add('show');
  tick(`${names.join('、')} 赢下 ${fmt(total)}。`);
  $('#potchips').innerHTML = '';
  for (const w of r.winners || []) {
    const g = byId[w.playerId]; if (!g) continue;
    on(g.i, true);
    const pile = el('div', 'bet', chipsSVG(w.amount, 4));
    pile.style.left = CX + 'px'; pile.style.top = '330px'; dyn.append(pile); pile.getBoundingClientRect();
    pile.style.left = g.bx + 'px'; pile.style.top = g.by + 'px';
  }
  countTo($('#potn'), pot, 0, 700); pot = 0;
  for (const g of G) {
    const final = r.stacks && r.stacks[g.id];
    if (final != null && final !== g.stack) { countTo(g.el.querySelector('.stk'), g.stack, final, 700); g.stack = final; }
  }
  await W(900);
  const losers = shown.filter(id => !winIds.includes(id));
  if (r.isShowdown && shown.length === 2 && losers.length === 1 && total >= 20 * LOG.blinds[1]) {
    const g = byId[losers[0]];
    g.el.classList.add('lose');
    stamp(g.x, g.ay - 130 * g.sc, '破防', 'huge');
  }
  await W(1700);
  $('#win').classList.remove('show');
  winIds.forEach(id => byId[id] && on(byId[id].i, false));
}

async function step(ev) {
  switch (ev.t) {
    case 'deal': await deal(); break;
    case 'blinds':
      if (ev.sb) setBet(ev.sb.p, ev.sb.amount);
      if (ev.bb) setBet(ev.bb.p, ev.bb.amount);
      street('翻牌前');
      await W(400);
      break;
    case 'act': await act(ev); break;
    case 'collect': await collect(); break;
    case 'board': await board(ev); break;
    case 'show': await show(); break;
    case 'end':
      camHome(2400);
      await W(1200);
      if (FF) break;
      if ($('#autonext').checked && CUR < LIST.length - 1) { await W(800); selectHand(CUR + 1); }
      else $('#end').classList.add('show');
      break;
  }
}

async function intro() {
  $('#introsub').textContent = `第 ${LOG.hand} 手`;
  $('#intro').classList.add('show');
  cam(800, 390, 1.45, 0);
  await W(FIRST ? 1600 : 1000);
  $('#intro').classList.remove('show');
  camHome(FIRST ? 3200 : 1800);
  await W(FIRST ? 1500 : 900);
  if (FIRST) for (const g of G) { on(g.i, true); await W(150); on(g.i, false); }
  FIRST = false;
}

async function start(target = 0) {
  run++;
  FF = target > 0;
  stage.classList.toggle('ff', FF);
  reset();
  $('#intro').classList.remove('show');
  camHome(0);
  try {
    if (!FF) await intro();
    for (const ev of SHOTS) {
      if (ev.t === 'chap') {
        if (FF && ev.i >= target) { FF = false; void stage.offsetWidth; stage.classList.remove('ff'); camHome(0); }
        chap(ev.i);
        continue;
      }
      await step(ev);
    }
  } catch (e) {
    if (e !== STOP) console.error(e);
  }
}

// ---------- hand list ----------
function play(log) {
  LOG = log;
  ({ shots: SHOTS, chaps: CHAPS } = direct(log));
  buildChaps();
  $('#title').textContent = `回放 · 第 ${log.hand} 手`;
  const names = log.players.map(p => p.name).join('、');
  $('#subtitle').textContent = `${log.players.length} 人桌 · ${names}`;
  $('#endsub').textContent = CUR < LIST.length - 1 ? '打开“连播”可以自动接着看下一手' : '这是最后一手';
  restart(0);
}

async function selectHand(k) {
  CUR = k;
  $('#handsel').value = String(k);
  const item = LIST[k];
  if (item.log) return play(item.log);
  try {
    const res = await fetch(`/api/hands/${encodeURIComponent(item.id)}`);
    if (!res.ok) throw new Error(res.status);
    play(await res.json());
  } catch (error) {
    $('#subtitle').textContent = `读取第 ${item.hand} 手失败：${error.message}`;
  }
}

async function loadList() {
  try {
    const res = await fetch('/api/hands');
    if (!res.ok) throw new Error(res.status);
    const hands = await res.json();
    if (!Array.isArray(hands) || !hands.length) throw new Error('empty');
    hands.sort((a, b) => String(a.startedAt).localeCompare(String(b.startedAt)));
    LIST = hands;
    $('#src').textContent = `共 ${hands.length} 手已记录`;
  } catch (error) {
    LIST = [{ id: SAMPLE.id, hand: SAMPLE.hand, session: SAMPLE.session, log: SAMPLE, winners: [{ name: '狂客', amount: 14700 }] }];
    $('#src').textContent = '还没有连上后端，正在播放示例手牌';
  }
  const sel = $('#handsel');
  sel.innerHTML = '';
  LIST.forEach((h, k) => {
    const w = (h.winners || []).map(x => `${x.name} +${fmt(x.amount)}`).join('、');
    sel.append(new Option(`第 ${h.hand} 手${w ? ' · ' + w : ''}`, String(k)));
  });
  // 默认从最近一场的第一手开始看
  const lastSession = LIST[LIST.length - 1].session;
  const want = location.hash.slice(1);
  let k = LIST.findIndex(h => h.id === want);
  if (k === -1) k = LIST.findIndex(h => h.session === lastSession);
  selectHand(Math.max(0, k));
}
